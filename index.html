<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSZ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { light: '#3b82f6', dark: '#60a5fa' },
                        glass: 'rgba(255, 255, 255, 0.1)',
                        darkbg: '#050505'
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', 'sans-serif';
            will-change: background-color;
        }
        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: url('bgopaks.png');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
        }

        /* ============================================
           ANIMATION SYSTEM
           Body'ye "no-anim" class'ı gelince tüm animasyonlar kapanır
           ============================================ */
        body.no-anim *,
        body.no-anim *::before,
        body.no-anim *::after {
            animation: none !important;
            transition: none !important;
            animation-duration: 0s !important;
            animation-delay: 0s !important;
            transition-duration: 0s !important;
            transition-delay: 0s !important;
        }
        body.no-anim {
            scroll-behavior: auto !important;
        }
        html.no-anim {
            scroll-behavior: auto !important;
        }

        /* Reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================
           SCROLL REVEAL ANIMATIONS
           ============================================ */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        body.no-anim .reveal {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .reveal-left {
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal-left.revealed { opacity: 1; transform: translateX(0); }

        .reveal-right {
            opacity: 0;
            transform: translateX(40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal-right.revealed { opacity: 1; transform: translateX(0); }

        .reveal-scale {
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reveal-scale.revealed { opacity: 1; transform: scale(1); }

        /* ============================================
           FLOATING / AMBIENT ANIMATIONS
           ============================================ */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(3deg); }
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 45px rgba(59, 130, 246, 0.8), 0 0 80px rgba(139, 92, 246, 0.4); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            60% { opacity: 1; transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes slideUpIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-4deg); }
            75% { transform: rotate(4deg); }
        }

        /* Animated background gradient when animations ON */
        body:not(.no-anim) {
            background-image: linear-gradient(135deg, transparent, rgba(59,130,246,0.04), transparent, rgba(139,92,246,0.04), transparent);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
            will-change: transform;
        }
        .dark .glass-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-logo {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .nav-link {
            position: relative;
            cursor: pointer;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1, #8b5cf6, #3b82f6);
            background-size: 300% 300%;
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        body:not(.no-anim) .btn-primary {
            animation: gradientShift 6s ease infinite;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active { transform: scale(0.96); }

        /* Gold Button */
        .btn-gold {
            background: linear-gradient(135deg, #facc15, #f59e0b, #fbbf24, #f59e0b);
            background-size: 300% 300%;
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 700;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.4);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            will-change: transform;
        }
        body:not(.no-anim) .btn-gold {
            animation: gradientShift 5s ease infinite;
        }
        .btn-gold:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 45px rgba(250, 204, 21, 0.6);
        }
        .btn-gold:active { transform: scale(0.95); }

        /* MSZ Team Card */
        .msz-team-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 8px 40px rgba(250, 204, 21, 0.15);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            will-change: transform;
        }
        .dark .msz-team-card {
            background: rgba(20, 20, 20, 0.7);
            border-color: rgba(250, 204, 21, 0.2);
        }
        .msz-team-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(250, 204, 21, 0.3);
        }
        .msz-team-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.1), transparent);
            transition: left 0.7s ease;
            pointer-events: none;
        }
        .msz-team-card:hover::before { left: 100%; }
        .msz-team-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 6px; height: 100%;
            background: linear-gradient(180deg, #facc15, #f59e0b, #facc15);
            background-size: 100% 200%;
            animation: goldShine 3s ease infinite;
        }
        @keyframes goldShine {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #facc15, #f59e0b, #fbbf24, #f59e0b);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldTextFlow 4s ease infinite;
        }
        @keyframes goldTextFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .gold-icon-circle {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.5), inset 0 -2px 10px rgba(180, 83, 9, 0.3);
        }
        .gold-sparkle {
            position: absolute;
            width: 4px; height: 4px;
            background: #facc15;
            border-radius: 50%;
            box-shadow: 0 0 8px #facc15, 0 0 16px #f59e0b;
            animation: sparkle 2.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .news-popup {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
        }
        .news-trigger {
            width: 65px; height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            will-change: transform;
        }
        body:not(.no-anim) .news-trigger {
            animation: glowPulse 3s ease-in-out infinite;
        }
        .news-trigger:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
        }
        .news-trigger:active { transform: scale(0.92); }
        .news-trigger i {
            font-size: 26px;
            color: white;
        }
        .news-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        body:not(.no-anim) .news-badge {
            animation: pulse 1.8s ease-in-out infinite;
        }
        .news-panel {
            position: fixed;
            bottom: 110px;
            left: 30px;
            width: 380px;
            max-height: 480px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            z-index: 998;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }
        .dark .news-panel {
            background: rgba(20,20,20,0.95);
            border-color: rgba(255,255,255,0.05);
        }
        .news-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }
        .news-panel-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .news-close {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        .news-close:hover { opacity: 1; }
        .news-list {
            padding: 10px 14px 14px 14px;
            max-height: 360px;
            overflow-y: auto;
        }
        .news-item {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.03);
            transition: background 0.2s ease, transform 0.2s ease;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            will-change: transform;
        }
        .dark .news-item { background: rgba(255,255,255,0.03); }
        .news-item:hover {
            background: rgba(59, 130, 246, 0.08);
            transform: translateX(4px);
        }
        .news-item-img {
            width: 52px; height: 52px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e7eb;
        }
        .dark .news-item-img { background: #374151; }
        .news-item-content { flex: 1; min-width: 0; }
        .news-item-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 3px;
            line-height: 1.3;
        }
        .news-item-desc {
            font-size: 12px;
            opacity: 0.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .news-item-date {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .news-item-tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 100px;
            margin-bottom: 4px;
        }
        .news-item-tag.hot { background: #ef4444; color: white; }
        .news-item-tag.new { background: #22c55e; color: white; }
        .news-item-tag.update { background: #3b82f6; color: white; }
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 12px;
        }
        .loading-spinner i {
            font-size: 28px;
            color: #3b82f6;
        }

        .news-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .news-modal.active {
            display: flex;
        }
        .news-modal-content {
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            animation: modalFade 0.25s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .dark .news-modal-content {
            background: rgba(20,20,20,0.98);
            border-color: rgba(255,255,255,0.05);
        }
        .news-modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 26px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            color: inherit;
        }
        .news-modal-close:hover { opacity: 1; }
        .news-modal-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 18px;
        }
        .news-modal-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .news-modal-desc {
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.8;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }
        .news-modal-date {
            font-size: 12px;
            opacity: 0.4;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .news-modal-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 100px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
            will-change: transform;
        }
        .news-modal-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }
        .news-modal-link.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Job Cards */
        .job-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            padding: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .dark .job-card {
            background: rgba(20, 20, 20, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
        }
        .job-card .job-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 16px;
            background: #e5e7eb;
        }
        .dark .job-card .job-img {
            background: #374151;
        }
        .job-card .job-title {
            font-size: 20px;
            font-weight: 700;
        }
        .job-card .job-desc {
            font-size: 14px;
            opacity: 0.7;
            line-height: 1.6;
        }
        .job-card .job-price {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #22c55e;
            color: white;
            font-weight: 700;
            font-size: 15px;
            padding: 6px 18px;
            border-radius: 100px;
            align-self: flex-start;
        }
        .job-card .job-price i {
            font-size: 14px;
        }
        .job-card .job-contact {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .job-card .job-contact a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 100px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .job-card .job-contact a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }

        /* Floating Instagram */
        .insta-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            background-size: 300% 300%;
            color: white;
            padding: 12px 22px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 8px 32px rgba(220, 39, 67, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            will-change: transform;
        }
        body:not(.no-anim) .insta-float {
            animation: gradientShift 5s ease infinite, float 3.5s ease-in-out infinite;
        }
        .insta-float:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 12px 40px rgba(220, 39, 67, 0.6);
        }
        .insta-float:active {
            transform: scale(0.95);
        }
        .insta-float i {
            font-size: 22px;
        }
        .insta-float .insta-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .insta-float .insta-text .insta-name {
            font-size: 13px;
            opacity: 0.9;
        }
        .insta-float .insta-text .insta-cta {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
        }
        @media (max-width: 640px) {
            .insta-float {
                bottom: 20px;
                right: 20px;

            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(96, 165, 250, 0.3);

        body:not(.no-anim) .anim-switch {

            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.35);
        }
        .anim-switch-track {
            position: relative;
            width: 48px;
            height: 26px;
            border-radius: 100px;
            background: linear-gradient(135deg, #cbd5e1, #94a3b8);
            transition: background 0.3s ease;
            flex-shrink: 0;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
        }
        .anim-switch.on .anim-switch-track {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.15), 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .anim-switch-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #3b82f6;
        }
        .anim-switch.on .anim-switch-thumb {
            left: 25px;
            color: #8b5cf6;
        }
        .anim-switch-thumb i {
            transition: transform 0.35s ease;
        }
        body:not(.no-anim) .anim-switch.on .anim-switch-thumb i {
            animation: rotateSlow 4s linear infinite;
        }
        .anim-switch-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .anim-switch-label .switch-title {
            font-size: 12px;
            font-weight: 800;
            color: #3b82f6;
        }
        .dark .anim-switch-label .switch-title {
            color: #60a5fa;
        }
        .anim-switch-label .switch-sub {
            font-size: 9px;
            opacity: 0.55;

        }

        .dark .anim-switch:not(.on) .switch-title { color: #64748b; }
        @media (max-width: 640px) {
            .anim-switch {
                top: 10px;
                left: 10px;
                padding: 6px 12px 6px 6px;
            }
            .anim-switch-label .switch-sub { display: none; }
            .anim-switch-track { width: 42px; height: 24px; }
            .anim-switch-thumb { width: 18px; height: 18px; }
            .anim-switch.on .anim-switch-thumb { left: 21px; }
        }

        /* Animation toggle notification toast */
        .anim-toast {
            position: fixed;
            top: 70px;

            display: flex;
            align-items: center;
            gap: 8px;
        }
        .anim-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .anim-toast.off {
            background: linear-gradient(135deg, #64748b, #475569);
        }
    </style>

                html.classList.remove('scroll-smooth');

            animToastText.textContent = text;

            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                animToast.classList.remove('show');

        }

            animationsEnabled = !animationsEnabled;
            localStorage.setItem('msz_animations', animationsEnabled ? 'on' : 'off');

            if (revealObserver) revealObserver.disconnect();
            revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                    }
                });
            }, {
                threshold: 0.12,
                rootMargin: '0px 0px -40px 0px'
            });

            document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(el => {
                revealObserver.observe(el);
            });
        }

            if (!animationsEnabled) {
                document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(el => {

        };

        // ========== BAD WORDS FILTER (kept for compatibility) ==========
        const badWords = ['amk', 'siktir', 'orospu', 'piç', 'mal', 'gerizekalı', 'aptal', 'salak', 'embesil', 'ibne', 'göt', 'sik', 'yarrak', 'am', 'fuck', 'shit', 'bitch', 'asshole', 'dick', 'porn', 'sex', 'nude', 'pussy', 'cunt', 'motherfucker'];
        function filterBadWords(text) {
            let filtered = text;
            badWords.forEach(word => {
                const regex = new RegExp('\\b' + word + '\\b|' + word, 'gi');
                filtered = filtered.replace(regex, '*****');
            });
            return filtered;
        }
        function containsBadWords(text) {
            const lower = text.toLowerCase();
            return badWords.some(word => lower.includes(word));
        }

        // ========== RENDER EXPERIENCES ==========
        function renderExperiences() {
            const grid = document.getElementById('projectGrid');
            if (!grid) return;

            let filtered = allProjects;
            if (activeCategory !== "all") {
                filtered = allProjects.filter(p => p.category === activeCategory);
            }

            grid.innerHTML = filtered.map((p, i) => {
                const badgeHtml = p.badge === 'soon' 
                    ? '<span class="project-badge soon">Coming Soon</span>' 
                    : p.badge === 'new' 
                        ? '<span class="project-badge new-badge">✨ New</span>' 
                        : p.badge === 'hot' 
                            ? '<span class="project-badge hot-badge">🔥 Hot</span>' 
                            : '';

                const isDisabled = p.link === '#';

                return `
                    <div class="project-card reveal-scale" style="transition-delay: ${Math.min(i * 0.05, 0.5)}s" onclick="${isDisabled ? '' : `window.open('${p.link}', '_blank')`}">
                        ${badgeHtml}
                        <i class="fas ${p.icon} project-icon"></i>
                        <div class="project-title">${p.title}</div>
                        <div class="project-desc">${p.desc}</div>
                        <div class="project-link ${isDisabled ? 'opacity-40' : ''}">
                            ${isDisabled ? '<i class="fas fa-clock"></i> Coming Soon' : `Explore <i class="fas fa-arrow-right"></i>`}
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === activeCategory);
            });

            // Trigger reveal after render
            requestAnimationFrame(() => {
                runScrollReveal();
            });
        }

        // ========== UI FUNCTIONS ==========
        function updateUI(page) {
            const content = document.getElementById('app-content');
            content.innerHTML = pages[page] || pages.home;
            window.scrollTo({ top: 0, behavior: animationsEnabled ? 'smooth' : 'auto' });
            
            const instaBtn = document.getElementById('instaFloat');
            if (instaBtn) {
                instaBtn.style.display = (page === 'jobs') ? 'flex' : 'none';
            }

            if (page === 'experiences') {
                activeCategory = 'all';
                renderExperiences();
            } else {
                // Auto-apply reveal to rendered cards
                setTimeout(() => {
                    autoApplyReveal();
                    runScrollReveal();
                }, 50);
            }
        }

        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('translate-x-full');
        }

        // ========== NEWS FUNCTIONS ==========
        function getTagHtml(tag) {
            if (!tag) return '';
            const tags = {
                hot: '<span class="news-item-tag hot">🔥 Hot</span>',
                new: '<span class="news-item-tag new">✨ New</span>',
                update: '<span class="news-item-tag update">🔄 Update</span>'
            };
            return tags[tag] || '';
        }

        function modalAc(item) {
            const modal = document.getElementById('newsModal');
            document.getElementById('modalImg').src = item.image || 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
            document.getElementById('modalImg').alt = item.title;
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalDesc').textContent = item.detail || item.summary || 'No details available.';
            document.getElementById('modalDateText').textContent = new Date(item.date).toLocaleDateString('en-GB');
            
            const linkBtn = document.getElementById('modalLink');
            if (item.link && item.link !== '#' && item.link !== 'https://...') {
                linkBtn.href = item.link;
                linkBtn.classList.remove('disabled');
                linkBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> View Details';
            } else {
                linkBtn.href = '#';
                linkBtn.classList.add('disabled');
                linkBtn.innerHTML = '<i class="fas fa-link"></i> No Link';
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function modalKapat() {
            const modal = document.getElementById('newsModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function haberleriGoster() {
            const list = document.getElementById('newsList');
            const badge = document.getElementById('newsBadge');
            
            if (!news || news.length === 0) {
                list.innerHTML = `<div class="news-empty"><i class="fas fa-newspaper text-4xl mb-3 opacity-30"></i><p>No news available.</p></div>`;
                badge.textContent = '0';
                return;
            }

            const sorted = [...news].sort((a, b) => new Date(b.date) - new Date(a.date));
            const shown = sorted.slice(0, 8);
            badge.textContent = news.length;

            list.innerHTML = shown.map((item) => {
                const imgSrc = item.image && item.image !== '' ? item.image : 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
                return `
                    <div class="news-item" onclick="modalAc(news.find(h => h.id === ${item.id}))">
                        <img src="${imgSrc}" class="news-item-img" alt="News image" loading="lazy" onerror="this.src='https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ'">
                        <div class="news-item-content">
                            ${getTagHtml(item.tag)}
                            <div class="news-item-title">${item.title || 'Untitled'}</div>
                            <div class="news-item-desc">${item.summary || 'No summary'}</div>
                            <div class="news-item-date">
                                <i class="far fa-clock"></i> ${item.date ? new Date(item.date).toLocaleDateString('en-GB') : 'No date'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== EVENT LISTENERS ==========
        document.getElementById('menu-btn').addEventListener('click', toggleMenu);
        document.getElementById('close-menu').addEventListener('click', toggleMenu);
        document.getElementById('logo-theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        document.getElementById('newsModal').addEventListener('click', function(e) {
            if (e.target === this) modalKapat();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') modalKapat();
        });

        const newsTrigger = document.getElementById('newsTrigger');
        const newsPanel = document.getElementById('newsPanel');
        const newsClose = document.getElementById('newsClose');

        newsTrigger.addEventListener('click', () => {
            newsPanel.classList.toggle('active');
            if (newsPanel.classList.contains('active')) {
                haberleriGoster();
            }
        });

        newsClose.addEventListener('click', () => {
            newsPanel.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (newsPanel.classList.contains('active')) {
                if (!newsPanel.contains(e.target) && !newsTrigger.contains(e.target)) {
                    newsPanel.classList.remove('active');
                }
            }
        });

        // Keyboard shortcut: press "A" to toggle animations
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'a' || e.key === 'A') {
                if (!e.ctrlKey && !e.metaKey) {
                    toggleAnimations();
                }
            }
        });

        // ========== INIT ==========
        window.onload = () => {
            applyAnimationState();
            updateUI('home');
            document.getElementById('newsBadge').textContent = news.length;
            haberleriGoster();

            // Ensure reveal classes applied on home load
            setTimeout(() => {
                autoApplyReveal();
                runScrollReveal();
            }, 100);
        };
