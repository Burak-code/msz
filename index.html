<html lang="tr" class="dark scroll-smooth">
<head>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Word dosyası okumak için mammoth.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js">
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: {
                            light: '#3b82f6',
                            dark: '#60a5fa',
                        },
                        glass: 'rgba(255, 255, 255, 0.1)',
                        darkbg: '#050505'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('bgopaks.png');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark .glass-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .neon-logo {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(0.98);
            }
        }

        .nav-link {
            position: relative;
            cursor: pointer;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: scale(0.5);
        }
        .btn-glow:hover::before {
            opacity: 1;
            transform: scale(1);
        }
        .btn-glow:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: inherit;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }

        /* Haber Bileşeni - Sol Alt */
        .news-popup {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .news-trigger {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .news-trigger:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
        }
        .news-trigger:active {
            transform: scale(0.9);
        }
        .news-trigger i {
            font-size: 28px;
            color: white;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }
        .news-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
        }

        .news-panel {
            position: fixed;
            bottom: 110px;
            left: 30px;
            width: 380px;
            max-height: 460px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            z-index: 998;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dark .news-panel {
            background: rgba(20,20,20,0.95);
            border-color: rgba(255,255,255,0.05);
        }
        .news-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }
        .news-panel-header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .news-panel-header i {
            font-size: 18px;
        }
        .news-close {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        .news-close:hover {
            opacity: 1;
            background: rgba(255,255,255,0.2);
        }
        .news-list {
            padding: 12px 16px 16px 16px;
            max-height: 340px;
            overflow-y: auto;
        }
        .news-item {
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .dark .news-item {
            background: rgba(255,255,255,0.03);
        }
        .news-item:hover {
            background: rgba(59, 130, 246, 0.08);
            border-left-color: #3b82f6;
            transform: translateX(4px);
        }
        .news-item-img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e7eb;
        }
        .dark .news-item-img {
            background: #374151;
        }
        .news-item-content {
            flex: 1;
            min-width: 0;
        }
        .news-item-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .news-item-desc {
            font-size: 12px;
            opacity: 0.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .news-item-date {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .news-empty {
            text-align: center;
            padding: 30px 0;
            opacity: 0.5;
        }

        /* Word'den gelen resimler için */
        .news-item-img.word-image {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Tıklama Ripple */
        .click-ripple {
            position: fixed;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Yükleniyor animasyonu */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 12px;
        }
        .loading-spinner i {
            font-size: 30px;
            color: #3b82f6;
        }
    </style>
</head>

    <!-- Tıklama Sesi (Web Audio API) -->
    <script>
        function playClickSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function createRipple(e) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            const rect = e.target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - size / 2) + 'px';
            ripple.style.top = (e.clientY - size / 2) + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        document.addEventListener('click', function(e) {
            const target = e.target.closest('button, .nav-link, .news-trigger, .news-close, .news-item, a, [onclick], .btn-primary, .btn-secondary');
            if (target) {
                playClickSound();
                createRipple(e);
            }
        });
    </script>

                            <a href="https://youtube.com/@msz-burak" target="_blank" class="flex items-center justify-between p-6 bg-white/5 rounded-2xl hover:bg-white/10 transition-colors border border-white/10 group">
                                <div class="flex items-center"><i class="fab fa-youtube text-red-600 mr-4 text-2xl"></i> <span>MSZ Burak</span></div>
                                <i class="fas fa-chevron-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            </a>
                        </div>
                    </div>
                `,
            html: `
                    <div class="space-y-10">
                        <div class="text-center" data-aos="fade-down">
                            <h2 class="text-4xl md:text-5xl font-bold mb-4 flex items-center justify-center gap-3">
                                <i class="fab fa-html5 text-orange-500"></i> HTML Demoları
                            </h2>
                            <p class="text-lg md:text-xl opacity-80 max-w-2xl mx-auto leading-relaxed">
                                Selam burada yapmış olduğum html demoları görebilirsiniz. Sizin için uyarlayarak web sitenizi yapabilirim.
                            </p>
                        </div>

                        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                            ${[
                                {title: "Restoran", file: "restoran.html", img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop&crop=center", icon: "fa-utensils"},
                                {title: "Berber", file: "berber.html", img: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=600&h=400&fit=crop&crop=center", icon: "fa-cut"},
                                {title: "Spor", file: "spor.html", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&h=400&fit=crop&crop=center", icon: "fa-dumbbell"},
                                {title: "Emlakçı", file: "emlak.html", img: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center", icon: "fa-building"},
                                {title: "Fotoğrafçı", file: "fotoğrafçı.html", img: "https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=600&h=400&fit=crop&crop=center", icon: "fa-camera"}
                            ].map((item, index) => `
                                    <div class="glass-card rounded-2xl overflow-hidden group transition-all hover:scale-[1.02] hover:shadow-xl hover:shadow-blue-500/10" data-aos="fade-up" data-aos-delay="${index * 80}">
                                        <div class="relative overflow-hidden h-48">
                                            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                            <div class="absolute top-3 left-3 bg-white/20 backdrop-blur-md rounded-full px-3 py-1.5 text-xs font-bold text-white flex items-center gap-1.5">
                                                <i class="fas ${item.icon}"></i> ${item.title}
                                            </div>
                                        </div>
                                        <div class="p-5 flex items-center justify-between">
                                            <div>
                                                <h3 class="text-xl font-bold">${item.title}</h3>
                                                <p class="text-sm opacity-60">HTML demosu</p>
                                            </div>
                                            <a href="${item.file}" target="_blank" class="btn-primary text-sm py-2 px-5">
                                                İncele <i class="fas fa-arrow-right text-xs"></i>
                                            </a>
                                        </div>
                                    </div>
                                `).join('')}
                        </div>

                        <div class="text-center pt-6 opacity-60 text-sm" data-aos="fade-up">
                            <i class="fas fa-external-link-alt mr-1"></i> Tıkladığınızda yeni sekmede açılır.
                        </div>
                    </div>
                `
        };

        const updateUI = (page) => {
            const main = document.getElementById('app-content');
            main.innerHTML = pages[page] || pages.home;
            AOS.refresh();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const toggleMenu = () => {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('translate-x-full');
        };

        document.getElementById('menu-btn').addEventListener('click', toggleMenu);
        document.getElementById('close-menu').addEventListener('click', toggleMenu);

        document.getElementById('logo-theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // ============ WORD BELGESİNDEN HABER OKUMA ============
        async function loadNewsFromWord() {
            const list = document.getElementById('newsList');
            const badge = document.getElementById('newsBadge');

            try {
                // haber.docx dosyasını fetch ile al
                const response = await fetch('haber.docx');
                if (!response.ok) throw new Error('NOT PAGES RECOGNİZED');

                const arrayBuffer = await response.arrayBuffer();

                // mammoth ile oku
                const result = await mammoth.convertToHtml({
                    arrayBuffer: arrayBuffer,
                    convertImage: mammoth.images.imgElement((image) => {
                        // Resimleri base64'e çevir
                        return image.read("base64").then((imageBuffer) => {
                            return {
                                src: "data:" + image.contentType + ";base64," + imageBuffer
                            };
                        });
                    })
                });

                const htmlContent = result.value;

                // HTML içeriğini parse et
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');

                // Resimleri ve metinleri topla
                let items = [];
                const body = doc.body;

                // Paragrafları ve resimleri sırayla al
                const children = body.children;
                let currentText = '';
                let currentImg = null;

                for (let i = 0; i < children.length; i++) {
                    const el = children[i];

                    if (el.tagName === 'P') {
                        const text = el.textContent.trim();
                        if (text.length > 0) {
                            // Önceki resim varsa onunla birleştir
                            if (currentImg) {
                                items.push({
                                    text: text,
                                    img: currentImg
                                });
                                currentImg = null;
                            } else {
                                // Sadece metin
                                items.push({
                                    text: text,
                                    img: null
                                });
                            }
                        }
                    } else if (el.tagName === 'IMG') {
                        const src = el.getAttribute('src');
                        if (src && src.startsWith('data:image')) {
                            currentImg = src;
                        }
                    } else if (el.tagName === 'FIGURE') {
                        // Figure içindeki img'i bul
                        const img = el.querySelector('img');
                        if (img) {
                            const src = img.getAttribute('src');
                            if (src && src.startsWith('data:image')) {
                                currentImg = src;
                            }
                        }
                        // Figure içindeki figcaption veya metin
                        const caption = el.querySelector('figcaption');
                        if (caption) {
                            const text = caption.textContent.trim();
                            if (text.length > 0) {
                                items.push({
                                    text: text,
                                    img: currentImg || null
                                });
                                currentImg = null;
                            }
                        }
                    }
                }

                // Eğer hiç öğe yoksa, düz metin olarak al
                if (items.length === 0) {
                    const allText = body.textContent.trim();
                    if (allText.length > 0) {
                        // Paragraflara böl
                        const paragraphs = allText.split(/\n\s*\n/).filter(p => p.trim().length > 0);
                        items = paragraphs.map(p => ({
                            text: p.trim(),
                            img: null
                        }));
                    }
                }

                // Word'den resim çıkarma işlemi
                // Eğer resim varsa ve metin yoksa, resmi göster
                const finalItems = [];
                let tempImg = null;

                for (const item of items) {
                    if (item.img && !item.text) {
                        // Sadece resim varsa
                        finalItems.push({
                            text: '📷 Görsel',
                            img: item.img
                        });
                    } else if (item.img && item.text) {
                        finalItems.push(item);
                    } else if (item.text) {
                        finalItems.push(item);
                    }
                }

                // Hiç haber yoksa örnek ver
                if (finalItems.length === 0) {
                    finalItems.push({
                        text: 'Word belgesinden haber okunamadı. Örnek haber gösteriliyor.',
                        img: null
                    });
                    finalItems.push({
                        text: 'haber.docx dosyasını kontrol edin.',
                        img: null
                    });
                }

                // Maksimum 8 haber göster
                const displayItems = finalItems.slice(0, 8);
                badge.textContent = displayItems.length;

                // Haberleri listele
                list.innerHTML = displayItems.map((item, i) => `
                        <div class="news-item" onclick="alert('${item.text.replace(/'/g, "\\'")}')">
                            ${item.img ? `<img src="${item.img}" class="news-item-img word-image" alt="Haber görseli">` : ''}
                            <div class="news-item-content">
                                <div class="news-item-title">${item.text.length > 60 ? item.text.substring(0, 60) + '...' : item.text}</div>
                                <div class="news-item-date">
                                    <i class="far fa-clock"></i> ${new Date().toLocaleDateString('tr-TR')}
                                </div>
                            </div>
                        </div>
                    `).join('');

            } catch (error) {
                console.error('Word okuma hatası:', error);
                list.innerHTML = `
                        <div class="news-item">
                            <div class="news-item-content">
                                <div class="news-item-title">Haber yok</div>
                                <div class="news-item-desc">Daha sonra gelin</div>
                                <div class="news-item-date">Hata: ${error.message}</div>
                            </div>
                        </div>
                        <div class="news-item" onclick="loadNewsFromWord()">
                            <div class="news-item-content">
                                <div class="news-item-title">🔄 Tekrar dene</div>
                                <div class="news-item-date">Tıkla</div>
                            </div>
                        </div>
                    `;
                badge.textContent = '!';
            }
        }

        // ============ HABER PANELİ KONTROLÜ ============
        const newsTrigger = document.getElementById('newsTrigger');
        const newsPanel = document.getElementById('newsPanel');
        const newsClose = document.getElementById('newsClose');

        let newsLoaded = false;

        newsTrigger.addEventListener('click', () => {
            newsPanel.classList.toggle('active');
            if (newsPanel.classList.contains('active') && !newsLoaded) {
                loadNewsFromWord();
                newsLoaded = true;
            }
        });

        newsClose.addEventListener('click', () => {
            newsPanel.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (newsPanel.classList.contains('active')) {
                if (!newsPanel.contains(e.target) && !newsTrigger.contains(e.target)) {
                    newsPanel.classList.remove('active');
                }
            }
        });

        // ============ BAŞLAT ============
        window.onload = () => {
            AOS.init({ duration: 800, once: true });
            updateUI('home');

            // Haber sayısını göster (yüklenene kadar)
            document.getElementById('newsBadge').textContent = '...';
        };
    </script>
</body>
</html>
