<html lang="en" class="dark scroll-smooth">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSZ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { light: '#3b82f6', dark: '#60a5fa' },
                        glass: 'rgba(255, 255, 255, 0.1)',
                        darkbg: '#050505'
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', 'sans-serif';
            will-change: background-color;
        }
        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: url('bgopaks.png');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
            will-change: transform;
        }
        .dark .glass-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-logo {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .nav-link {
            position: relative;
            cursor: pointer;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active { transform: scale(0.96); }

        .news-popup {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
        }
        .news-trigger {
            width: 65px; height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            will-change: transform;
        }
        .news-trigger:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
        }
        .news-trigger:active { transform: scale(0.92); }
        .news-trigger i {
            font-size: 26px;
            color: white;
        }
        .news-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        .news-panel {
            position: fixed;
            bottom: 110px;
            left: 30px;
            width: 360px;
            max-height: 440px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            z-index: 998;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }
        .dark .news-panel {
            background: rgba(20,20,20,0.95);
            border-color: rgba(255,255,255,0.05);
        }
        .news-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }
        .news-panel-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .news-close {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        .news-close:hover { opacity: 1; }
        .news-list {
            padding: 10px 14px 14px 14px;
            max-height: 320px;
            overflow-y: auto;
        }
        .news-item {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.03);
            transition: background 0.2s ease, transform 0.2s ease;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            will-change: transform;
        }
        .dark .news-item { background: rgba(255,255,255,0.03); }
        .news-item:hover {
            background: rgba(59, 130, 246, 0.08);
            transform: translateX(4px);
        }
        .news-item-img {
            width: 48px; height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e7eb;
        }
        .dark .news-item-img { background: #374151; }
        .news-item-content { flex: 1; min-width: 0; }
        .news-item-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 3px;
            line-height: 1.3;
        }
        .news-item-desc {
            font-size: 12px;
            opacity: 0.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .news-item-date {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 12px;
        }
        .loading-spinner i {
            font-size: 28px;
            color: #3b82f6;
        }

        .news-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .news-modal.active {
            display: flex;
        }
        .news-modal-content {
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            animation: modalFade 0.25s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .dark .news-modal-content {
            background: rgba(20,20,20,0.98);
            border-color: rgba(255,255,255,0.05);
        }
        .news-modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 26px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            color: inherit;
        }
        .news-modal-close:hover { opacity: 1; }
        .news-modal-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 14px;
        }
        .news-modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .news-modal-desc {
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.8;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }
        .news-modal-date {
            font-size: 12px;
            opacity: 0.4;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .news-modal-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 100px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
            will-change: transform;
        }
        .news-modal-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }
        .news-modal-link.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .star-rating input { display: none; }
        .star-rating label {
            font-size: 32px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #f59e0b !important;
        }
        .star-rating input:checked ~ label {
            color: #f59e0b !important;
        }
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
        }
        .comment-item {
            transition: all 0.2s ease;
        }
        .comment-item:hover {
            background: rgba(59, 130, 246, 0.05);
        }
        .comment-banned {
            background: rgba(239, 68, 68, 0.1) !important;
            border-left: 3px solid #ef4444;
        }
        .comment-banned .comment-text {
            filter: blur(3px);
            user-select: none;
        }
        .comment-text {
            word-break: break-word;
        }
        .comment-stars {
            letter-spacing: 2px;
        }

        .rating-1 { color: #ef4444; }
        .rating-2 { color: #ec4899; }
        .rating-3 { color: #9ca3af; }
        .rating-4 { color: #34d399; }
        .rating-5 { color: #059669; }

        .avg-rating-container {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(99, 102, 241, 0.1));
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }
        .avg-stars {
            font-size: 28px;
            letter-spacing: 3px;
        }
    </style>
</head>

            comments: `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold mb-2 text-center">💬 Comments</h2>
                    <p class="text-center opacity-60 mb-8 text-sm">Share your thoughts about MSZ. Be respectful! 🙏</p>

                    <div class="glass-card rounded-3xl p-6 mb-8">
                        <h3 class="text-xl font-bold mb-4">✍️ Write a Comment</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold mb-1">Name <span class="text-red-500">*</span></label>
                                <input type="text" id="commentName" placeholder="Your name..." class="w-full px-4 py-3 rounded-2xl bg-white/50 dark:bg-white/5 border border-white/20 focus:border-blue-500 focus:outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">Instagram (optional)</label>
                                <input type="text" id="commentIg" placeholder="@username" class="w-full px-4 py-3 rounded-2xl bg-white/50 dark:bg-white/5 border border-white/20 focus:border-blue-500 focus:outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">Gmail (optional)</label>
                                <input type="email" id="commentEmail" placeholder="example@gmail.com" class="w-full px-4 py-3 rounded-2xl bg-white/50 dark:bg-white/5 border border-white/20 focus:border-blue-500 focus:outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-2">Rating <span class="text-red-500">*</span></label>
                                <div class="flex flex-row-reverse justify-end gap-1 text-4xl star-rating" id="starRating">
                                    <input type="radio" name="rating" id="star5" value="5">
                                    <label for="star5" title="5 stars">★</label>
                                    <input type="radio" name="rating" id="star4" value="4">
                                    <label for="star4" title="4 stars">★</label>
                                    <input type="radio" name="rating" id="star3" value="3">
                                    <label for="star3" title="3 stars">★</label>
                                    <input type="radio" name="rating" id="star2" value="2">
                                    <label for="star2" title="2 stars">★</label>
                                    <input type="radio" name="rating" id="star1" value="1">
                                    <label for="star1" title="1 star">★</label>
                                </div>
                                <p class="text-xs opacity-50 mt-1" id="ratingText">Tap a star to rate</p>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">Message <span class="text-red-500">*</span></label>
                                <textarea id="commentMsg" rows="3" placeholder="Write your comment..." class="w-full px-4 py-3 rounded-2xl bg-white/50 dark:bg-white/5 border border-white/20 focus:border-blue-500 focus:outline-none transition resize-none"></textarea>
                            </div>
                            <button onclick="submitComment()" class="btn-primary w-full justify-center">
                                <i class="fas fa-paper-plane"></i> Send Comment
                            </button>
                        </div>
                    </div>

                    <div class="glass-card rounded-3xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-bold">📋 All Comments</h3>
                            <span class="text-sm opacity-50" id="commentCount">0 comments</span>
                        </div>
                        <div id="commentList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                            <div class="text-center py-8 opacity-40" id="emptyComment">
                                <i class="fas fa-comment-slash text-4xl mb-2 block"></i>
                                No comments yet. Be the first!
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        // ========== BAD WORDS FILTER ==========
        const badWords = [
            'amk', 'siktir', 'orospu', 'piç', 'mal', 'gerizekalı', 'aptal', 'salak', 
            'embesil', 'ibne', 'göt', 'sik', 'yarrak', 'am', 'fuck', 'shit', 'bitch', 
            'asshole', 'dick', 'porn', 'sex', 'nude', 'pussy', 'cunt', 'motherfucker'
        ];

        function filterBadWords(text) {
            let filtered = text;
            badWords.forEach(word => {
                const regex = new RegExp('\\b' + word + '\\b|' + word, 'gi');
                filtered = filtered.replace(regex, '*****');
            });
            return filtered;
        }

        function containsBadWords(text) {
            const lower = text.toLowerCase();
            return badWords.some(word => lower.includes(word));
        }

        // ========== LOCAL STORAGE COMMENTS ==========
        let selectedRating = 0;

        function getComments() {
            try {
                return JSON.parse(localStorage.getItem('msz_comments') || '[]');
            } catch {
                return [];
            }
        }

        function saveComments(comments) {
            localStorage.setItem('msz_comments', JSON.stringify(comments));
        }

        function setRating(val) {
            selectedRating = val;
            localStorage.setItem('selectedRating', val);
            
            const inputs = document.querySelectorAll('.star-rating input');
            inputs.forEach(input => {
                input.checked = parseInt(input.value) === val;
            });
            
            const labels = document.querySelectorAll('.star-rating label');
            labels.forEach(label => {
                const starVal = parseInt(label.htmlFor.replace('star', ''));
                label.style.color = starVal <= val ? '#f59e0b' : '#ccc';
            });
            
            const ratingText = document.getElementById('ratingText');
            if (ratingText) ratingText.textContent = val + ' / 5 ★';
        }

        function restoreRating() {
            const savedRating = localStorage.getItem('selectedRating');
            if (savedRating && parseInt(savedRating) > 0) {
                setRating(parseInt(savedRating));
                return true;
            }
            return false;
        }

        function getRatingClass(rating) {
            if (rating === 1) return 'rating-1';
            if (rating === 2) return 'rating-2';
            if (rating === 3) return 'rating-3';
            if (rating === 4) return 'rating-4';
            if (rating === 5) return 'rating-5';
            return '';
        }

        function getStars(rating) {
            const colorClass = getRatingClass(rating);
            return `<span class="comment-stars ${colorClass}">${'★'.repeat(rating)}${'☆'.repeat(5-rating)}</span>`;
        }

        function submitComment() {
            const name = document.getElementById('commentName').value.trim();
            const message = document.getElementById('commentMsg').value.trim();
            const ig = document.getElementById('commentIg').value.trim();
            const email = document.getElementById('commentEmail').value.trim();

            if (!name) { alert('⚠️ Please enter your name!'); return; }
            if (!message) { alert('⚠️ Please write a message!'); return; }
            if (selectedRating === 0) { alert('⚠️ Please select a rating!'); return; }

            const hasBadWords = containsBadWords(name) || containsBadWords(message);
            const filteredMessage = filterBadWords(message);
            const filteredName = filterBadWords(name);

            const comments = getComments();
            comments.unshift({
                id: Date.now(),
                name: filteredName,
                message: filteredMessage,
                rating: selectedRating,
                ig: ig || '',
                email: email || '',
                isBanned: hasBadWords,
                timestamp: new Date().toISOString()
            });
            saveComments(comments);

            document.getElementById('commentName').value = '';
            document.getElementById('commentMsg').value = '';
            document.getElementById('commentIg').value = '';
            document.getElementById('commentEmail').value = '';
            setRating(0);
            document.querySelectorAll('.star-rating input').forEach(input => input.checked = false);
            document.querySelectorAll('.star-rating label').forEach(label => label.style.color = '#ccc');
            document.getElementById('ratingText').textContent = 'Tap a star to rate';

            renderComments();
            alert(hasBadWords ? '⚠️ Your comment contains inappropriate language and has been marked as banned.' : '✅ Your comment has been posted successfully!');
        }

        function renderComments() {
            const list = document.getElementById('commentList');
            const count = document.getElementById('commentCount');
            if (!list) return;

            const comments = getComments();
            const totalComments = comments.length;
            let avgRating = 0;
            if (totalComments > 0) {
                const totalRating = comments.reduce((sum, c) => sum + (c.rating || 0), 0);
                avgRating = totalRating / totalComments;
            }
            const avgStars = '★'.repeat(Math.round(avgRating)) + '☆'.repeat(5 - Math.round(avgRating));
            const avgColor = getRatingClass(Math.round(avgRating));

            count.textContent = totalComments + ' comments';

            const ratingSummary = totalComments > 0 ? `
                <div class="avg-rating-container mb-4 flex items-center justify-between flex-wrap gap-3">
                    <div class="flex items-center gap-3">
                        <span class="avg-stars ${avgColor}">${avgStars}</span>
                        <span class="text-2xl font-bold">${avgRating.toFixed(1)}</span>
                        <span class="text-sm opacity-50">/ 5.0</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm opacity-60">
                        <i class="fas fa-users"></i>
                        <span>${totalComments} reviews</span>
                    </div>
                </div>
            ` : '';

            if (totalComments === 0) {
                list.innerHTML = `${ratingSummary}<div class="text-center py-8 opacity-40"><i class="fas fa-comment-slash text-4xl mb-2 block"></i>No comments yet. Be the first!</div>`;
                return;
            }

            list.innerHTML = ratingSummary + comments.map(c => {
                const date = new Date(c.timestamp);
                const dateStr = date.toLocaleDateString('en-GB') + ' ' + date.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
                
                let contactHtml = '';
                if (c.ig) contactHtml += `<a href="https://instagram.com/${c.ig.replace('@','')}" target="_blank" class="text-pink-500 hover:underline text-sm"><i class="fab fa-instagram"></i> ${c.ig}</a>`;
                if (c.email) contactHtml += (contactHtml ? ' • ' : '') + `<a href="mailto:${c.email}" class="text-blue-400 hover:underline text-sm"><i class="fas fa-envelope"></i> ${c.email}</a>`;
                
                const bannedClass = c.isBanned ? 'comment-banned' : '';
                const bannedText = c.isBanned ? '<span class="text-red-500 text-xs font-bold ml-2">⚠️ BANNED</span>' : '';

                return `
                    <div class="comment-item p-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/10 ${bannedClass}">
                        <div class="flex justify-between items-start flex-wrap gap-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-lg">${c.name}</span>
                                ${bannedText}
                            </div>
                            ${getStars(c.rating || 0)}
                        </div>
                        ${contactHtml ? `<div class="text-xs opacity-60 my-1">${contactHtml}</div>` : ''}
                        <div class="comment-text ${c.isBanned ? 'text-red-400 italic' : ''} mt-1 text-sm leading-relaxed">
                            ${c.isBanned ? '⚠️ This comment has been banned for inappropriate content.' : c.message}
                        </div>
                        <div class="text-xs opacity-40 mt-2">${dateStr}</div>
                    </div>
                `;
            }).join('');
        }

        // ========== UI FUNCTIONS ==========
        function updateUI(page) {
            const content = document.getElementById('app-content');
            content.innerHTML = pages[page] || pages.home;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            if (page === 'comments') {
                setTimeout(() => {
                    restoreRating();
                    document.querySelectorAll('.star-rating input').forEach(input => {
                        input.addEventListener('click', function() {
                            setRating(parseInt(this.value));
                        });
                    });
                    renderComments();
                }, 50);
            }
        }

        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('translate-x-full');
        }

        // ========== NEWS FUNCTIONS ==========
        function modalAc(haber) {
            const modal = document.getElementById('newsModal');
            document.getElementById('modalImg').src = haber.resim || 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
            document.getElementById('modalImg').alt = haber.baslik;
            document.getElementById('modalTitle').textContent = haber.baslik;
            document.getElementById('modalDesc').textContent = haber.ozet;
            document.getElementById('modalDateText').textContent = new Date(haber.tarih).toLocaleDateString('en-GB');
            
            const linkBtn = document.getElementById('modalLink');
            if (haber.link && haber.link !== '#' && haber.link !== 'https://...') {
                linkBtn.href = haber.link;
                linkBtn.classList.remove('disabled');
                linkBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> View Details';
            } else {
                linkBtn.href = '#';
                linkBtn.classList.add('disabled');
                linkBtn.innerHTML = '<i class="fas fa-link"></i> No Link';
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function modalKapat() {
            const modal = document.getElementById('newsModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function haberleriGoster() {
            const list = document.getElementById('newsList');
            const badge = document.getElementById('newsBadge');
            
            if (!haberler || haberler.length === 0) {
                list.innerHTML = `<div class="news-empty"><i class="fas fa-newspaper text-4xl mb-3 opacity-30"></i><p>No news available.</p></div>`;
                badge.textContent = '0';
                return;
            }

            const sirali = [...haberler].sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            const gosterilecek = sirali.slice(0, 8);
            badge.textContent = haberler.length;

            list.innerHTML = gosterilecek.map((haber) => {
                const imgSrc = haber.resim && haber.resim !== '' ? haber.resim : 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
                return `
                    <div class="news-item" onclick="modalAc(haberler.find(h => h.id === ${haber.id}))">
                        <img src="${imgSrc}" class="news-item-img" alt="News image" loading="lazy" onerror="this.src='https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ'">
                        <div class="news-item-content">
                            <div class="news-item-title">${haber.baslik || 'Untitled'}</div>
                            <div class="news-item-desc">${haber.ozet || 'No summary'}</div>
                            <div class="news-item-date">
                                <i class="far fa-clock"></i> ${haber.tarih ? new Date(haber.tarih).toLocaleDateString('en-GB') : 'No date'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== EVENT LISTENERS ==========
        document.getElementById('menu-btn').addEventListener('click', toggleMenu);
        document.getElementById('close-menu').addEventListener('click', toggleMenu);
        document.getElementById('logo-theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        document.getElementById('newsModal').addEventListener('click', function(e) {
            if (e.target === this) modalKapat();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') modalKapat();
        });

        const newsTrigger = document.getElementById('newsTrigger');
        const newsPanel = document.getElementById('newsPanel');
        const newsClose = document.getElementById('newsClose');

        newsTrigger.addEventListener('click', () => {
            newsPanel.classList.toggle('active');
            if (newsPanel.classList.contains('active')) {
                haberleriGoster();
            }
        });

        newsClose.addEventListener('click', () => {
            newsPanel.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (newsPanel.classList.contains('active')) {
                if (!newsPanel.contains(e.target) && !newsTrigger.contains(e.target)) {
                    newsPanel.classList.remove('active');
                }
            }
        });

        // ========== INIT ==========
        window.onload = () => {
            updateUI('home');
            document.getElementById('newsBadge').textContent = haberler.length;
            haberleriGoster();
        };
    </script>
