    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { light: '#3b82f6', dark: '#60a5fa' },
                        glass: 'rgba(255, 255, 255, 0.1)',
                        darkbg: '#050505'
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: url('bgopaks.png');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glass-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-logo {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .nav-link {
            position: relative;
            cursor: pointer;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active { transform: scale(0.96); }

        /* ============ HABER BİLEŞENİ ============ */
        .news-popup {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .news-trigger {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .news-trigger:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
        }
        .news-trigger:active { transform: scale(0.9); }
        .news-trigger i {
            font-size: 28px;
            color: white;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }
        .news-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
        }
        .news-panel {
            position: fixed;
            bottom: 110px;
            left: 30px;
            width: 380px;
            max-height: 460px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            z-index: 998;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dark .news-panel {
            background: rgba(20,20,20,0.95);
            border-color: rgba(255,255,255,0.05);
        }
        .news-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }
        .news-panel-header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .news-close {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        .news-close:hover { opacity: 1; background: rgba(255,255,255,0.2); }
        .news-list {
            padding: 12px 16px 16px 16px;
            max-height: 340px;
            overflow-y: auto;
        }
        .news-item {
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .dark .news-item { background: rgba(255,255,255,0.03); }
        .news-item:hover {
            background: rgba(59, 130, 246, 0.08);
            border-left-color: #3b82f6;
            transform: translateX(4px);
        }
        .news-item-img {
            width: 50px; height: 50px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e7eb;
        }
        .dark .news-item-img { background: #374151; }
        .news-item-content { flex: 1; min-width: 0; }
        .news-item-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .news-item-desc {
            font-size: 12px;
            opacity: 0.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .news-item-date {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .news-empty {
            text-align: center;
            padding: 30px 0;
            opacity: 0.5;
        }
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 12px;
        }
        .loading-spinner i {
            font-size: 30px;
            color: #3b82f6;
        }
        .click-ripple {
            position: fixed;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ============ HABER DETAY MODAL ============ */
        .news-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFade 0.3s ease;
        }
        .news-modal.active {
            display: flex;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .news-modal-content {
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .dark .news-modal-content {
            background: rgba(20,20,20,0.98);
            border-color: rgba(255,255,255,0.05);
        }
        .news-modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
            background: none;
            border: none;
            color: inherit;
        }
        .news-modal-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }
        .news-modal-img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .news-modal-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .news-modal-desc {
            font-size: 16px;
            line-height: 1.8;
            opacity: 0.8;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        .news-modal-date {
            font-size: 13px;
            opacity: 0.4;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .news-modal-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 100px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .news-modal-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }
        .news-modal-link i {
            font-size: 14px;
        }
        .news-modal-link.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>

    <script>
        function playClickSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }
        function createRipple(e) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            const rect = e.target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - size / 2) + 'px';
            ripple.style.top = (e.clientY - size / 2) + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }
        document.addEventListener('click', function(e) {
            const target = e.target.closest('button, .nav-link, .news-trigger, .news-close, .news-item, a, [onclick], .btn-primary, .news-modal-close');
            if (target) { playClickSound(); createRipple(e); }
        });
    </script>

            `,
            contact: `
                <div class="max-w-3xl mx-auto glass-card p-10 rounded-3xl text-center" data-aos="zoom-in">
                    <h2 class="text-4xl font-bold mb-8">Bağlantı Kur</h2>
                    <p class="mb-10 opacity-70">Projeleriniz veya tanışmak için bana ulaşın.</p>
                    <div class="grid gap-6 text-left">
                        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=burakbilec123@gmail.com" target="_blank" class="flex items-center justify-between p-6 bg-white/5 rounded-2xl hover:bg-white/10 transition-colors border border-white/10 group">
                            <div class="flex items-center"><i class="fas fa-envelope text-red-400 mr-4 text-2xl"></i> <span>Gmail</span></div>
                            <i class="fas fa-chevron-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                        <a href="https://instagram.com/burak_msz/" target="_blank" class="flex items-center justify-between p-6 bg-white/5 rounded-2xl hover:bg-white/10 transition-colors border border-white/10 group">
                            <div class="flex items-center"><i class="fab fa-instagram text-pink-500 mr-4 text-2xl"></i> <span>@burak_msz</span></div>

            html: `

                        <p class="text-lg md:text-xl opacity-80 max-w-2xl mx-auto leading-relaxed">Selam burada yapmış olduğum html demoları görebilirsiniz. Sizin için uyarlayarak web sitenizi yapabilirim.</p>
                    </div>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                        ${[
                            {title: "CV", file: "ito.chef.html", img: "https://st2.depositphotos.com/1967477/8956/v/450/depositphotos_89562614-stock-illustration-cartoon-funny-italian-chef-cartoon.jpg", icon: "fa-utensils"},
                            {title: "Restoran", file: "restoran.html", img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop&crop=center", icon: "fa-utensils"},
                            {title: "Berber", file: "berber.html", img: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=600&h=400&fit=crop&crop=center", icon: "fa-cut"},
                            {title: "Spor", file: "spor.html", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&h=400&fit=crop&crop=center", icon: "fa-dumbbell"},
                            {title: "Emlakçı", file: "emlak.html", img: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center", icon: "fa-building"},
                            {title: "Fotoğrafçı", file: "fotoğrafçı.html", img: "https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=600&h=400&fit=crop&crop=center", icon: "fa-camera"}
                        ].map((item, index) => `
                            <div class="glass-card rounded-2xl overflow-hidden group transition-all hover:scale-[1.02] hover:shadow-xl hover:shadow-blue-500/10" data-aos="fade-up" data-aos-delay="${index * 80}">
                                <div class="relative overflow-hidden h-48">
                                    <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    <div class="absolute top-3 left-3 bg-white/20 backdrop-blur-md rounded-full px-3 py-1.5 text-xs font-bold text-white flex items-center gap-1.5"><i class="fas ${item.icon}"></i> ${item.title}</div>
                                </div>
                                <div class="p-5 flex items-center justify-between">
                                    <div><h3 class="text-xl font-bold">${item.title}</h3><p class="text-sm opacity-60">HTML demosu</p></div>
                                    <a href="${item.file}" target="_blank" class="btn-primary text-sm py-2 px-5">İncele <i class="fas fa-arrow-right text-xs"></i></a>

                    </div>
                    <div class="text-center pt-6 opacity-60 text-sm" data-aos="fade-up"><i class="fas fa-external-link-alt mr-1"></i> Tıkladığınızda yeni sekmede açılır.</div>
                </div>
            `
        };

        const updateUI = (page) => {
            document.getElementById('app-content').innerHTML = pages[page] || pages.home;
            AOS.refresh();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const toggleMenu = () => {
            document.getElementById('mobile-menu').classList.toggle('translate-x-full');
        };

        document.getElementById('menu-btn').addEventListener('click', toggleMenu);
        document.getElementById('close-menu').addEventListener('click', toggleMenu);
        document.getElementById('logo-theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // ============ MODAL FONKSİYONLARI ============
        function modalAc(haber) {
            const modal = document.getElementById('newsModal');
            document.getElementById('modalImg').src = haber.resim || 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
            document.getElementById('modalImg').alt = haber.baslik;
            document.getElementById('modalTitle').textContent = haber.baslik;
            document.getElementById('modalDesc').textContent = haber.ozet;
            document.getElementById('modalDateText').textContent = new Date(haber.tarih).toLocaleDateString('tr-TR') + ' ' + new Date(haber.tarih).toLocaleTimeString('tr-TR');
            
            const linkBtn = document.getElementById('modalLink');
            if (haber.link && haber.link !== '#' && haber.link !== 'https://...') {
                linkBtn.href = haber.link;
                linkBtn.classList.remove('disabled');
                linkBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> Detayları Gör';
            } else {
                linkBtn.href = '#';
                linkBtn.classList.add('disabled');
                linkBtn.innerHTML = '<i class="fas fa-link"></i> Link Yok';
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function modalKapat() {
            const modal = document.getElementById('newsModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Modal dışına tıklayınca kapat
        document.getElementById('newsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                modalKapat();
            }
        });

        // ESC tuşu ile kapat
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                modalKapat();
            }
        });

        // ============ HABERLERİ GÖSTER ============
        function haberleriGoster() {
            const list = document.getElementById('newsList');
            const badge = document.getElementById('newsBadge');
            
            if (!haberler || haberler.length === 0) {
                list.innerHTML = `
                    <div class="news-empty">
                        <i class="fas fa-newspaper text-4xl mb-3 opacity-30"></i>
                        <p>Henüz haber yok.</p>
                    </div>
                `;
                badge.textContent = '0';
                return;
            }

            const sirali = [...haberler].sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            const gosterilecek = sirali.slice(0, 8);
            
            badge.textContent = haberler.length;

            list.innerHTML = gosterilecek.map((haber, index) => {
                const imgSrc = haber.resim && haber.resim !== '' ? haber.resim : 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
                
                return `
                    <div class="news-item" onclick="modalAc(haberler.find(h => h.id === ${haber.id}))">
                        <img src="${imgSrc}" class="news-item-img" alt="Haber görseli" onerror="this.src='https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ'">
                        <div class="news-item-content">
                            <div class="news-item-title">${haber.baslik || 'Başlıksız'}</div>
                            <div class="news-item-desc">${haber.ozet || 'Özet yok'}</div>
                            <div class="news-item-date">
                                <i class="far fa-clock"></i> ${haber.tarih ? new Date(haber.tarih).toLocaleDateString('tr-TR') : 'Tarih yok'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============ HABER PANELİ KONTROLÜ ============
        const newsTrigger = document.getElementById('newsTrigger');
        const newsPanel = document.getElementById('newsPanel');
        const newsClose = document.getElementById('newsClose');

        newsTrigger.addEventListener('click', () => {
            newsPanel.classList.toggle('active');
            if (newsPanel.classList.contains('active')) {
                haberleriGoster();
            }
        });

        newsClose.addEventListener('click', () => {
            newsPanel.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (newsPanel.classList.contains('active')) {
                if (!newsPanel.contains(e.target) && !newsTrigger.contains(e.target)) {
                    newsPanel.classList.remove('active');
                }
            }
        });

        // ============ BAŞLAT ============
        window.onload = () => {
            AOS.init({ duration: 800, once: true });
            updateUI('home');
            
            document.getElementById('newsBadge').textContent = haberler.length;
            haberleriGoster();
        };
    </script>
</body>
</html>
