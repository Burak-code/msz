<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSZ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { light: '#3b82f6', dark: '#60a5fa' },
                        glass: 'rgba(255, 255, 255, 0.1)',
                        darkbg: '#050505'
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', 'sans-serif';
            will-change: background-color;
        }
        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: url('bgopaks.png');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
            will-change: transform;
        }
        .dark .glass-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-logo {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .nav-link {
            position: relative;
            cursor: pointer;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active { transform: scale(0.96); }

        /* ============ NEWS COMPONENT ============ */
        .news-popup {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
        }
        .news-trigger {
            width: 65px; height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            will-change: transform;
        }
        .news-trigger:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
        }
        .news-trigger:active { transform: scale(0.92); }
        .news-trigger i {
            font-size: 26px;
            color: white;
        }
        .news-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        .news-panel {
            position: fixed;
            bottom: 110px;
            left: 30px;
            width: 360px;
            max-height: 440px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            z-index: 998;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }
        .dark .news-panel {
            background: rgba(20,20,20,0.95);
            border-color: rgba(255,255,255,0.05);
        }
        .news-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }
        .news-panel-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .news-close {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        .news-close:hover { opacity: 1; }
        .news-list {
            padding: 10px 14px 14px 14px;
            max-height: 320px;
            overflow-y: auto;
        }
        .news-item {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.03);
            transition: background 0.2s ease, transform 0.2s ease;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            will-change: transform;
        }
        .dark .news-item { background: rgba(255,255,255,0.03); }
        .news-item:hover {
            background: rgba(59, 130, 246, 0.08);
            transform: translateX(4px);
        }
        .news-item-img {
            width: 48px; height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e7eb;
        }
        .dark .news-item-img { background: #374151; }
        .news-item-content { flex: 1; min-width: 0; }
        .news-item-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 3px;
            line-height: 1.3;
        }
        .news-item-desc {
            font-size: 12px;
            opacity: 0.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .news-item-date {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 12px;
        }
        .loading-spinner i {
            font-size: 28px;
            color: #3b82f6;
        }

        /* ============ NEWS DETAIL MODAL ============ */
        .news-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .news-modal.active {
            display: flex;
        }
        .news-modal-content {
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            animation: modalFade 0.25s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .dark .news-modal-content {
            background: rgba(20,20,20,0.98);
            border-color: rgba(255,255,255,0.05);
        }
        .news-modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 26px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            color: inherit;
        }
        .news-modal-close:hover { opacity: 1; }
        .news-modal-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 14px;
        }
        .news-modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .news-modal-desc {
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.8;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }
        .news-modal-date {
            font-size: 12px;
            opacity: 0.4;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .news-modal-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 100px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
            will-change: transform;
        }
        .news-modal-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }
        .news-modal-link.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>

                        </a>
                        <a href="https://instagram.com/burak_msz/" target="_blank" class="flex items-center justify-between p-5 bg-white/5 rounded-2xl hover:bg-white/10 transition-colors border border-white/10 group">
                            <div class="flex items-center"><i class="fab fa-instagram text-pink-500 mr-4 text-xl"></i> <span>@burak_msz</span></div>
                            <i class="fas fa-chevron-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                        <a href="https://youtube.com/@msz-burak" target="_blank" class="flex items-center justify-between p-5 bg-white/5 rounded-2xl hover:bg-white/10 transition-colors border border-white/10 group">
                            <div class="flex items-center"><i class="fab fa-youtube text-red-600 mr-4 text-xl"></i> <span>MSZ Burak</span></div>
                            <i class="fas fa-chevron-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                    </div>
                </div>
            `,
            html: `
                <div class="space-y-8">
                    <div class="text-center">
                        <h2 class="text-3xl md:text-4xl font-bold mb-3 flex items-center justify-center gap-3"><i class="fab fa-html5 text-orange-500"></i> HTML Demos</h2>
                        <p class="text-base md:text-lg opacity-80 max-w-2xl mx-auto leading-relaxed">Hello, you can see the HTML demos I have created here. I can adapt them for you and build your website.</p>
                    </div>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${[
                            {title: "CV", file: "html/ito.chef.html", img: "https://st2.depositphotos.com/1967477/8956/v/450/depositphotos_89562614-stock-illustration-cartoon-funny-italian-chef-cartoon.jpg", icon: "fa-utensils"},
                            {title: "Restaurant", file: "html/restoran.html", img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop&crop=center", icon: "fa-utensils"},
                            {title: "Barber", file: "html/berber.html", img: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=600&h=400&fit=crop&crop=center", icon: "fa-cut"},
                            {title: "Sports", file: "html/spor.html", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&h=400&fit=crop&crop=center", icon: "fa-dumbbell"},
                            {title: "Real Estate", file: "html/emlak.html", img: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center", icon: "fa-building"},
                            {title: "Photographer", file: "html/fotoğrafçı.html", img: "https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=600&h=400&fit=crop&crop=center", icon: "fa-camera"}
                        ].map((item, index) => `
                            <div class="glass-card rounded-2xl overflow-hidden group transition-transform hover:scale-[1.02] hover:shadow-xl hover:shadow-blue-500/10">
                                <div class="relative overflow-hidden h-44">
                                    <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    <div class="absolute top-3 left-3 bg-white/20 backdrop-blur-md rounded-full px-3 py-1 text-xs font-bold text-white flex items-center gap-1.5"><i class="fas ${item.icon}"></i> ${item.title}</div>
                                </div>
                                <div class="p-4 flex items-center justify-between">
                                    <div><h3 class="text-lg font-bold">${item.title}</h3><p class="text-xs opacity-60">HTML demo</p></div>
                                    <a href="${item.file}" target="_blank" class="btn-primary text-sm py-1.5 px-4">View <i class="fas fa-arrow-right text-xs"></i></a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="text-center pt-4 opacity-60 text-sm"><i class="fas fa-external-link-alt mr-1"></i> Opens in a new tab when clicked.</div>
                </div>
            `
        };

        // Page transition - optimised
        const updateUI = (page) => {
            const content = document.getElementById('app-content');
            content.innerHTML = pages[page] || pages.home;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const toggleMenu = () => {
            document.getElementById('mobile-menu').classList.toggle('translate-x-full');
        };

        document.getElementById('menu-btn').addEventListener('click', toggleMenu);
        document.getElementById('close-menu').addEventListener('click', toggleMenu);
        document.getElementById('logo-theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // ============ MODAL FUNCTIONS ============
        function modalAc(haber) {
            const modal = document.getElementById('newsModal');
            document.getElementById('modalImg').src = haber.resim || 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
            document.getElementById('modalImg').alt = haber.baslik;
            document.getElementById('modalTitle').textContent = haber.baslik;
            document.getElementById('modalDesc').textContent = haber.ozet;
            document.getElementById('modalDateText').textContent = new Date(haber.tarih).toLocaleDateString('en-GB') + ' ' + new Date(haber.tarih).toLocaleTimeString('en-GB');
            
            const linkBtn = document.getElementById('modalLink');
            if (haber.link && haber.link !== '#' && haber.link !== 'https://...') {
                linkBtn.href = haber.link;
                linkBtn.classList.remove('disabled');
                linkBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> View Details';
            } else {
                linkBtn.href = '#';
                linkBtn.classList.add('disabled');
                linkBtn.innerHTML = '<i class="fas fa-link"></i> No Link';
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function modalKapat() {
            const modal = document.getElementById('newsModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('newsModal').addEventListener('click', function(e) {
            if (e.target === this) modalKapat();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') modalKapat();
        });

        // ============ DISPLAY NEWS ============
        function haberleriGoster() {
            const list = document.getElementById('newsList');
            const badge = document.getElementById('newsBadge');
            
            if (!haberler || haberler.length === 0) {
                list.innerHTML = `
                    <div class="news-empty">
                        <i class="fas fa-newspaper text-4xl mb-3 opacity-30"></i>
                        <p>No news available.</p>
                    </div>
                `;
                badge.textContent = '0';
                return;
            }

            const sirali = [...haberler].sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            const gosterilecek = sirali.slice(0, 8);
            
            badge.textContent = haberler.length;

            list.innerHTML = gosterilecek.map((haber) => {
                const imgSrc = haber.resim && haber.resim !== '' ? haber.resim : 'https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ';
                
                return `
                    <div class="news-item" onclick="modalAc(haberler.find(h => h.id === ${haber.id}))">
                        <img src="${imgSrc}" class="news-item-img" alt="News image" loading="lazy" onerror="this.src='https://via.placeholder.com/60x60/3b82f6/ffffff?text=MSZ'">
                        <div class="news-item-content">
                            <div class="news-item-title">${haber.baslik || 'Untitled'}</div>
                            <div class="news-item-desc">${haber.ozet || 'No summary'}</div>
                            <div class="news-item-date">
                                <i class="far fa-clock"></i> ${haber.tarih ? new Date(haber.tarih).toLocaleDateString('en-GB') : 'No date'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============ NEWS PANEL CONTROL ============
        const newsTrigger = document.getElementById('newsTrigger');
        const newsPanel = document.getElementById('newsPanel');
        const newsClose = document.getElementById('newsClose');

        newsTrigger.addEventListener('click', () => {
            newsPanel.classList.toggle('active');
            if (newsPanel.classList.contains('active')) {
                haberleriGoster();
            }
        });

        newsClose.addEventListener('click', () => {
            newsPanel.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (newsPanel.classList.contains('active')) {
                if (!newsPanel.contains(e.target) && !newsTrigger.contains(e.target)) {
                    newsPanel.classList.remove('active');
                }
            }
        });

        // ============ INITIALISE ============
        window.onload = () => {
            updateUI('home');
            document.getElementById('newsBadge').textContent = haberler.length;
            haberleriGoster();
        };
    </script>
</body>
</html>
