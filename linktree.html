<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSZ | Sosyal Medya</title>
<style>
  /* Sayfanın tamamını dikey ve yatayda tam ortalamak için Flexbox */
  body {
      background-color: black;
      color: white;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center; /* Yatayda ortala */
      align-items: center;     /* Dikeyde ortala */
  }

  /* Butonları dikey dizecek kapsayıcı kutu */
  .container {
      display: flex;
      flex-direction: column;
      gap: 16px; /* Butonlar arasındaki dikey boşluk */
      width: 100%;
      max-width: 320px; /* Mobil ekranlarda taşmasın diye */
      padding: 20px;
  }

  /* Dev Boyutlu Buton Stili */
  .btn {
      width: 100%;
      height: 60px;                  /* Yükseklik 60px'e çıkarıldı */
      padding: 12px 24px;
      border: 2px solid black;
      border-radius: 30px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.8);
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;               /* Yazı boyutu büyütüldü */
      letter-spacing: 1px;
      transition: all 0.2s ease;
  }

  /* Fareyle üzerine gelince efekt */
  .btn:hover {
      background-color: #ffffff !important;
      color: #000000 !important;
      transform: translateY(-4px);   /* Yukarı kayma efekti */
      box-shadow: 0 10px 20px rgba(255,255,255,0.2);
  }

  /* Buton Renkleri */
  .webs     { background-color: #d7ff00; color: black; }
  .insta    { background-color: #c800ff; color: white; }
  .yt       { background-color: #ff0000; color: white; }
  .tt       { background-color: #424242; color: white; }
  .linkedin { background-color: #0077b5; color: white; }
  .x-corp   { background-color: #14171a; color: white; border: 2px solid #333; }
</style>
</head>
<body>

  <div class="container">
    <button onclick="window.open('https://burak-code.github.io/msz/')" class="btn webs"> WEBS </button>
    <button onclick="window.open('https://www.instagram.com/burak_msz/')" class="btn insta"> İNSTA </button>
    <button onclick="window.open('https://www.youtube.com/@msz-burak')" class="btn yt"> YT </button>
    <button onclick="window.open('https://www.tiktok.com/@arex_msz')" class="btn tt"> TİKTOK </button>
    <button onclick="window.open('https://www.linkedin.com/in/burakmsz/')" class="btn linkedin"> LINKEDIN </button>
    <button onclick="window.open('https://x.com/burak_msz__')" class="btn x-corp"> X </button>
  </div>

</body>
</html>
