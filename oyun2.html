<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSZ Girişim Simülatörü</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111;
      color: #f0f0f0;
      padding: 20px;
      display: grid;
      grid-template-areas:
        "info   market   portfolio"
        "menu   market   portfolio"
        "log    log      log";
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    body.light-mode {
      background-color: #f0f0f0;
      color: #111;
    }
    h1 {
      color: #00ff99;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    .light-mode h1 {
      color: #009966;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      background-color: #00ff99;
      border: none;
      border-radius: 8px;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    button:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }
    .light-mode button {
      background-color: #009966;
      color: #f0f0f0;
    }
    #log {
      background-color: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      max-height: 180px;
      overflow-y: auto;
      grid-area: log;
      border: 1px solid #333;
      font-size: 0.85rem;
    }
    .light-mode #log {
      background-color: #eee;
      border-color: #ccc;
    }
    .section {
      background-color: #222;
      padding: 15px;
      border-radius: 12px;
      height: fit-content;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .light-mode .section {
      background-color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #game-info { grid-area: info; }
    #game-menu { grid-area: menu; }
    #marketSection { grid-area: market; }
    #portfolio { grid-area: portfolio; }
    
    .market-item, .owned-item {
      background-color: #333;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border-left: 4px solid #00ff99;
    }
    .light-mode .market-item, .light-mode .owned-item {
      background-color: #f9f9f9;
      border-left-color: #009966;
    }
    input {
      width: calc(100% - 16px);
      padding: 6px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 0.8rem;
    }
    .light-mode input {
      background: #fff;
      color: #111;
      border-color: #ccc;
    }
    .settings-menu {
      display: none;
      flex-direction: column;
      gap: 10px;
      background-color: #333;
      padding: 20px;
      border-radius: 12px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .settings-menu.active { display: flex; }
    .hidden { display: none; }
    .crash-text { color: #ff4444; font-weight: bold; }
    small { font-size: 0.75rem; color: #aaa; }
  </style>
</head>
<body class="dark-mode">
  <div id="game-info" class="section">
    <h1>📈 MSZ Sim</h1>
    <p><strong>Bakiye:</strong> <span id="money">5000</span> TL</p>
    <p><strong>Zaman:</strong> <span id="time">1 / 1</span></p>
    <p><strong>İşlem:</strong> <span id="actions">6</span></p>
    <div id="debt-status" class="hidden">
      <p><strong>Borç:</strong> <span id="debt-amount">0</span> TL</p>
      <button id="repay-debt-button" onclick="repayLoan()">💰 Borcu Kapat</button>
    </div>
    <button onclick="nextMonth()">⏭️ Ayı Geç</button>
    <button id="debt-button" onclick="takeLoan()">💸 Borç Al (50k)</button>
    <button onclick="openSettings()">⚙️ Ayarlar</button>
  </div>

  <div id="game-menu" class="section">
    <button onclick="openMenu('phone')">📱 Telefon</button>
    <button onclick="openMenu('car')">🚗 Araba</button>
    <button onclick="openMenu('house')">🏠 Ev</button>
    <button onclick="work()">💼 Çalış (+500 TL)</button>
  </div>
  
  <div id="settings-menu" class="settings-menu">
    <h3>Ayarlar</h3>
    <button onclick="setTheme('dark')">Koyu</button>
    <button onclick="setTheme('light')">Açık</button>
    <button onclick="openSettings()">Kapat</button>
  </div>

  <div id="marketSection" class="section">
    <p>Kategori seç.</p>
  </div>

  <div id="portfolio" class="section">
    <h3>💼 Varlıklar</h3>
    <div id="ownedItems"></div>
  </div>

  <div id="log"></div>

  <script>
    let money = 5000;
    let month = 1;
    let year = 1;
    let actions = 6;
    let debt = 0;
    let currentMenu = "";
    
    let cars = [], phones = [], houses = [];

    const marketConfig = {
      phone: { min: 10000, max: 100000, items: [
        { id: 1, model: "Android X", base: 15000 },
        { id: 2, model: "iPhone Pro Max", base: 85000 }
      ]},
      car: { min: 100000, max: 700000, items: [
        { id: 3, model: "Eski Tofaş", base: 120000 },
        { id: 4, model: "Yeni Sedan", base: 550000 }
      ]},
      house: { min: 700000, max: 3000000, items: [
        { id: 5, model: "1+1 Stüdyo", base: 850000 },
        { id: 6, model: "3+1 Villa", base: 2600000 }
      ]}
    };

    let marketData = { phone: [], car: [], house: [] };
    let crashCategory = null;

    function initMarket() {
      for (let cat in marketConfig) {
        marketData[cat] = marketConfig[cat].items.map(item => ({
          ...item,
          price: item.base,
          condition: Math.random() > 0.7 ? "Hasarlı" : "Hasarsız"
        }));
      }
    }

    function updatePrice(cat) {
      const config = marketConfig[cat];
      marketData[cat].forEach(item => {
        let changePercent = (Math.random() * 0.2) - 0.08;
        let newPrice = item.price * (1 + changePercent);
        if (newPrice < config.min) newPrice = config.min + 2000;
        if (newPrice > config.max) newPrice = config.max - 2000;
        item.price = Math.floor(newPrice);
      });
    }

    function nextMonth() {
      month++;
      if (month > 12) { month = 1; year++; }
      actions = 6;

      // Sabit gider (Hayat pahalılığı)
      money -= 8000;

      // Ev kiralarını topla
      let totalRent = 0;
      houses.forEach(h => {
        if (h.currentRent > 0) {
          totalRent += h.currentRent;
        }
      });
      if (totalRent > 0) {
        money += totalRent;
        log(`🏠 Evlerden toplam ${totalRent.toLocaleString()} TL kira geliri aldın.`);
      }

      // Otomatik Borç ödemesi (Her ay 5k)
      if (debt > 0) {
        let payment = Math.min(debt, 5000);
        debt -= payment;
        money -= (payment + 1000); // 5k ana para + 1k faiz/masraf
        log(`💸 Banka borç taksiti (${(payment + 1000).toLocaleString()} TL) ödendi. Kalan borç: ${debt.toLocaleString()} TL`);
      }

      for (let cat in marketData) { updatePrice(cat); }

      if (Math.random() > 0.75 && !crashCategory) {
        const categories = ['phone', 'car', 'house'];
        crashCategory = categories[Math.floor(Math.random() * categories.length)];
        marketData[crashCategory].forEach(item => item.price = Math.floor(item.price * 0.5));
        log(`<span class="crash-text">⚠️ EKONOMİK ÇÖKÜŞ: ${crashCategory.toUpperCase()} fiyatları yarıya düştü!</span>`);
      } else if (crashCategory) {
        crashCategory = null;
      }

      renderMarket();
      renderOwned();
      updateDisplay();
    }

    function buyItem(id) {
      if (actions <= 0) return log("İşlem hakkın kalmadı!");
      let item = marketData[currentMenu].find(i => i.id === id);
      if (money >= item.price) {
        money -= item.price;
        actions--;
        let owned = { ...item, buyPrice: item.price, type: currentMenu, currentRent: 0 };
        if (currentMenu === 'car') cars.push(owned);
        else if (currentMenu === 'phone') phones.push(owned);
        else houses.push(owned);
        
        log(`✅ ${item.model} satın alındı.`);
        updateDisplay();
        renderOwned();
      } else {
        log("❌ Paran yetmiyor!");
      }
    }

    function sellItem(type, index) {
      if (actions <= 0) return log("İşlem hakkın kalmadı!");
      let list = type === 'car' ? cars : type === 'phone' ? phones : houses;
      let item = list[index];
      let input = document.getElementById(`sell-${type}-${index}`);
      let sellPrice = parseInt(input.value);

      const maxSellPrice = Math.floor(item.buyPrice * 1.5);

      if (sellPrice > maxSellPrice) {
        return log(`⚠️ Çok pahalı! Satış fiyatı max 1.5 kat (${maxSellPrice.toLocaleString()} TL) olabilir.`);
      }

      money += sellPrice;
      actions--;
      list.splice(index, 1);
      log(`🔻 ${item.model} ${sellPrice.toLocaleString()} TL'ye satıldı.`);
      updateDisplay();
      renderOwned();
    }

    function setRent(index) {
      let house = houses[index];
      let input = document.getElementById(`rent-house-${index}`);
      let rentPrice = parseInt(input.value);

      const maxRent = Math.floor(house.buyPrice * 0.01); // %1 kuralı

      if (rentPrice > maxRent) {
        return log(`⚠️ Kira çok yüksek! Max kira: ${maxRent.toLocaleString()} TL (Alış fiyatının %1'i).`);
      }

      house.currentRent = rentPrice;
      log(`🏠 ${house.model} için aylık kira ${rentPrice.toLocaleString()} TL olarak belirlendi.`);
      renderOwned();
    }

    function work() {
      if (actions <= 0) return log("İşlem hakkın kalmadı!");
      money += 500;
      actions--;
      log("💼 İşte çalışarak 500 TL kazandın.");
      updateDisplay();
    }

    function renderMarket() {
      const container = document.getElementById("marketSection");
      if (!currentMenu) return;
      container.innerHTML = `<h3>${currentMenu.toUpperCase()} Pazarı</h3>`;
      marketData[currentMenu].forEach(item => {
        container.innerHTML += `
          <div class="market-item">
            <strong>${item.model}</strong> (${item.condition})<br>
            Fiyat: ${item.price.toLocaleString()} TL<br>
            <button onclick="buyItem(${item.id})">Satın Al</button>
          </div>`;
      });
    }

    function renderOwned() {
      const container = document.getElementById("ownedItems");
      container.innerHTML = "";
      
      const renderList = (list, type) => {
        list.forEach((item, i) => {
          let extraHtml = "";
          if (type === 'house') {
            extraHtml = `
              <small>Kira (Max %1): ${Math.floor(item.buyPrice * 0.01).toLocaleString()} TL</small>
              <input type="number" id="rent-house-${i}" value="${item.currentRent || 0}">
              <button onclick="setRent(${i})">Kira Belirle</button>
            `;
          }
          container.innerHTML += `
            <div class="owned-item">
              <strong>${item.model}</strong><br>
              <small>Alış: ${item.buyPrice.toLocaleString()} TL | Max Satış: ${Math.floor(item.buyPrice * 1.5).toLocaleString()} TL</small>
              ${extraHtml}
              <input type="number" id="sell-${type}-${i}" value="${Math.floor(item.buyPrice * 1.1)}">
              <button onclick="sellItem('${type}', ${i})">Sat</button>
            </div>`;
        });
      };

      renderList(phones, 'phone');
      renderList(cars, 'car');
      renderList(houses, 'house');
    }

    function updateDisplay() {
      document.getElementById("money").innerText = money.toLocaleString();
      document.getElementById("time").innerText = `${month} / ${year}`;
      document.getElementById("actions").innerText = actions;
      const d = document.getElementById("debt-status");
      const db = document.getElementById("debt-button");
      
      if (debt > 0) {
        d.classList.remove("hidden");
        document.getElementById("debt-amount").innerText = debt.toLocaleString();
        db.disabled = true;
      } else {
        d.classList.add("hidden");
        db.disabled = false;
      }
    }

    function log(msg) {
      const l = document.getElementById("log");
      l.innerHTML = `<p>> ${msg}</p>` + l.innerHTML;
    }

    function openMenu(m) { currentMenu = m; renderMarket(); }
    function setTheme(t) { document.body.className = t + '-mode'; }
    function openSettings() { document.getElementById("settings-menu").classList.toggle("active"); }
    
    function takeLoan() { 
      if(debt === 0){
        debt = 50000; 
        money += 50000; 
        updateDisplay(); 
        log("💸 50.000 TL borç alındı. Her ay 5k ödenecek.");
      }
    }

    function repayLoan() { 
      if(money >= debt) {
        money -= debt; 
        log(`💰 ${debt.toLocaleString()} TL ödenerek borç tamamen kapatıldı.`);
        debt = 0; 
        updateDisplay(); 
      } else {
        log("❌ Borcu kapatmak için yeterli bakiyen yok!");
      }
    }

    initMarket();
    updateDisplay();
  </script>
</body>
</html>
