<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MSZ Pixel - Dünya Haritası Piksel Boyama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseModules = {
      initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
      getFirestore, doc, setDoc, collection, onSnapshot, addDoc, getDocs
    };
  </script>
  <style>
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    .scrollbar-thin::-webkit-scrollbar { width: 5px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #0f172a; }
  </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden bg-slate-950 text-slate-100">

  <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
      <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-500/30 text-3xl">
        <i class="fa-solid fa-paintbrush"></i>
      </div>
      <h1 class="text-2xl font-black text-white mb-2 tracking-wide">MSZ Pixel</h1>
      <p class="text-slate-400 text-xs sm:text-sm mb-6">Dünya haritası üzerinde istediğin pikselleri tek tek boya ve canlı sohbete katıl!</p>
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="text-left">
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Kullanıcı Adı</label>
          <input type="text" id="usernameInput" required maxlength="16" placeholder="PikselRessami"
                 class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
          <span>Haritaya Katıl</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>
  </div>

  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600/20 border border-blue-500/40 rounded-xl flex items-center justify-center text-blue-400">
        <i class="fa-solid fa-earth-americas text-lg"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-sm md:text-base leading-tight">MSZ Pixel</h1>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span id="statusIndicator" class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
          <span id="mqttStatus">Bağlanıyor...</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleGrid()" id="gridBtn" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium border border-blue-500 flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-border-all"></i><span class="hidden sm:inline">Izgara</span>
      </button>
      <button onclick="resetView()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition-colors" title="Haritayı Ortala">
        <i class="fa-solid fa-compress"></i><span class="hidden sm:inline">Ortala</span>
      </button>
      <button onclick="toggleAudio()" id="audioBtn" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition-colors" title="Ses Aç/Kapat">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button onclick="toggleChat()" class="md:hidden p-2 bg-blue-600 text-white rounded-lg text-xs font-medium transition-colors" title="Chat">
        <i class="fa-solid fa-comments"></i>
      </button>
    </div>
  </header>

  <div class="flex-1 flex relative overflow-hidden">
    <div class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden cursor-crosshair" id="canvasViewport">
      <canvas id="worldCanvas" class="shadow-2xl"></canvas>
      <div class="absolute bottom-5 left-5 flex flex-col bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-1 gap-1 shadow-2xl z-20">
        <button onclick="zoomInButton()" class="w-9 h-9 flex items-center justify-center hover:bg-slate-800 text-slate-200 rounded-lg text-lg font-bold transition-colors active:scale-90" title="Yakınlaş">
          <i class="fa-solid fa-plus text-sm"></i>
        </button>
        <div class="h-px bg-slate-800"></div>
        <button onclick="zoomOutButton()" class="w-9 h-9 flex items-center justify-center hover:bg-slate-800 text-slate-200 rounded-lg text-lg font-bold transition-colors active:scale-90" title="Uzaklaş">
          <i class="fa-solid fa-minus text-sm"></i>
        </button>
        <div class="h-px bg-slate-800"></div>
        <button onclick="resetView()" class="w-9 h-9 flex items-center justify-center hover:bg-slate-800 text-slate-200 rounded-lg text-xs font-bold transition-colors active:scale-90" title="Sıfırla">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
      <div class="absolute top-4 left-4 bg-slate-900/85 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-slate-300 shadow-md font-mono z-20 flex items-center gap-3">
        <span id="coordDisplay">X: 0, Y: 0</span>
        <span class="text-slate-700">|</span>
        <span class="text-emerald-400 font-semibold">3x Harita | Sadece İç Karalar Boyanabilir</span>
      </div>
    </div>

    <div id="chatSidebar" class="w-full md:w-80 bg-slate-900 border-l border-slate-800 flex flex-col absolute md:relative inset-0 z-30 transform translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-comments text-blue-400 text-sm"></i>
          <span class="font-bold text-sm">Canlı Chat</span>
        </div>
        <button onclick="toggleChat()" class="md:hidden text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-3 font-sans text-xs scrollbar-thin">
        <div class="bg-blue-950/40 border border-blue-800/40 text-blue-300 p-2.5 rounded-lg text-xs leading-relaxed">
          🌍 <strong>MSZ Pixel 3x Ölçekte Hazır!</strong><br>Karalar beyaz, deniz sınırları siyah piksellerle kaplıdır.
        </div>
      </div>
      <form id="chatForm" onsubmit="sendChatMessage(event)" class="p-3 border-t border-slate-800 flex gap-2">
        <input type="text" id="chatInput" placeholder="Mesaj yaz..." maxlength="100"
               class="flex-1 bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <footer class="bg-slate-900 border-t border-slate-800 p-3 z-20 shrink-0">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 overflow-x-auto pb-1 scrollbar-thin">
      <div class="flex items-center gap-2 border-b sm:border-b-0 sm:border-r border-slate-800 pb-2 sm:pb-0 sm:pr-4 shrink-0">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Boyut:</span>
        <div class="flex gap-1">
          <button onclick="setBrushSize(1)" id="brushBtn1" class="w-7 h-7 rounded-lg bg-blue-600 text-white text-xs font-bold border border-blue-400">1x1</button>
          <button onclick="setBrushSize(2)" id="brushBtn2" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:bg-slate-700">2x2</button>
          <button onclick="setBrushSize(3)" id="brushBtn3" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:bg-slate-700">3x3</button>
        </div>
      </div>
      <div id="paletteContainer" class="flex items-center gap-1.5 mx-auto overflow-x-auto py-0.5"></div>
      <div class="flex items-center gap-2 shrink-0 border-t sm:border-t-0 sm:border-l border-slate-800 pt-2 sm:pt-0 sm:pl-3">
        <label class="text-xs text-slate-400 font-semibold">Özel Renk:</label>
        <input type="color" id="customColorInput" onchange="selectCustomColor(this.value)" value="#ef4444" class="w-7 h-7 rounded cursor-pointer bg-transparent border-0 p-0">
      </div>
    </div>
  </footer>

  <script>
    const audio = {
      enabled: true, ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      playPaintSound() {
        if (!this.enabled) return; this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      },
      playChatSound() {
        if (!this.enabled) return; this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
          osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.2);
        } catch (e) {}
      }
    };

    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 1500;
    let landMask = new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT);
    let paintableMask = new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT);

    const PALETTE = [
      { name: "Kırmızı", hex: "#ef4444" }, { name: "Siyah", hex: "#000000" },
      { name: "Beyaz", hex: "#ffffff" }, { name: "Koyu Gri", hex: "#334155" },
      { name: "Gri", hex: "#64748b" }, { name: "Koyu Kırmızı", hex: "#991b1b" },
      { name: "Turuncu", hex: "#f97316" }, { name: "Sarı", hex: "#eab308" },
      { name: "Açık Yeşil", hex: "#22c55e" }, { name: "Koyu Yeşil", hex: "#15803d" },
      { name: "Açık Mavi", hex: "#38bdf8" }, { name: "Mavi", hex: "#2563eb" },
      { name: "Lacivert", hex: "#1e3a8a" }, { name: "Mor", hex: "#a855f7" },
      { name: "Pembe", hex: "#ec4899" }, { name: "Kahverengi", hex: "#78350f" }
    ];

    // === MSZ Pixel - Çoklu Broker Yapılandırması ===
    const MQTT_BROKERS = [
      { host: "broker.emqx.io",    port: 8084, ssl: true,  path: "/mqtt" },
      { host: "broker.hivemq.com", port: 8884, ssl: true,  path: "/mqtt" },
      { host: "test.mosquitto.org",port: 8081, ssl: true,  path: "/mqtt" }
    ];
    const MQTT_TOPIC_PIXEL = "msz_pixel/pixel/v1";
    const MQTT_TOPIC_CHAT  = "msz_pixel/chat/v1";
    const LS_PIXEL_KEY     = "msz_pixel_last_pixel";
    const LS_CHAT_KEY      = "msz_pixel_last_chat";

    let username = "Oyuncu";
    let selectedColor = PALETTE[0].hex;
    let brushSize = 1;
    let showGrid = true;

    function handleLogin(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('usernameInput');
      const val = input ? input.value.trim() : '';
      if (val) username = val;
      document.getElementById('loginModal').classList.add('hidden');
      audio.init();
      // BroadcastChannel'e kullanıcı adını bildir
      if (localChannel) localChannel.postMessage({ type: 'hello', user: username });
    }

    let zoomLevel = 0.8, viewX = 0, viewY = 0;
    let isMouseDown = false, isDragging = false;
    let dragStartX = 0, dragStartY = 0, dragStartViewX = 0, dragStartViewY = 0;
    let touchStartDist = 0;

    const viewport = document.getElementById('canvasViewport');
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = WORLD_WIDTH;
    offscreenCanvas.height = WORLD_HEIGHT;
    const offscreenCtx = offscreenCanvas.getContext('2d');

    const modifiedPixels = new Map();

    function loadWorldMap() {
      const mapImg = new Image();
      mapImg.crossOrigin = "anonymous";
      mapImg.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = WORLD_WIDTH; tempCanvas.height = WORLD_HEIGHT;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        tempCtx.drawImage(mapImg, 0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        const imgData = tempCtx.getImageData(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        const data = imgData.data;
        for (let i = 0; i < WORLD_WIDTH * WORLD_HEIGHT; i++) {
          const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
          landMask[i] = (r > 240 && g > 240 && b > 240) ? 0 : 1;
        }
        renderProcessedMapBuffer();
        renderCanvas();
      };
      mapImg.onerror = () => { drawFallbackWorldMap(); renderCanvas(); };
      mapImg.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/1280px-World_map_-_low_resolution.svg.png";
    }

    function renderProcessedMapBuffer() {
      const outImgData = offscreenCtx.createImageData(WORLD_WIDTH, WORLD_HEIGHT);
      const outData = outImgData.data;
      const oceanR = 15, oceanG = 23, oceanB = 42;
      for (let y = 0; y < WORLD_HEIGHT; y++) {
        for (let x = 0; x < WORLD_WIDTH; x++) {
          const idx = y * WORLD_WIDTH + x;
          const outIdx = idx * 4;
          if (landMask[idx] === 0) {
            paintableMask[idx] = 0;
            outData[outIdx] = oceanR; outData[outIdx+1] = oceanG; outData[outIdx+2] = oceanB; outData[outIdx+3] = 255;
          } else {
            let isCoastline = false;
            if (x === 0 || x === WORLD_WIDTH - 1 || y === 0 || y === WORLD_HEIGHT - 1) isCoastline = true;
            else if (landMask[idx-1] === 0 || landMask[idx+1] === 0 || landMask[idx-WORLD_WIDTH] === 0 || landMask[idx+WORLD_WIDTH] === 0) isCoastline = true;
            if (isCoastline) {
              paintableMask[idx] = 0;
              outData[outIdx] = 0; outData[outIdx+1] = 0; outData[outIdx+2] = 0; outData[outIdx+3] = 255;
            } else {
              paintableMask[idx] = 1;
              outData[outIdx] = 255; outData[outIdx+1] = 255; outData[outIdx+2] = 255; outData[outIdx+3] = 255;
            }
          }
        }
      }
      offscreenCtx.putImageData(outImgData, 0, 0);
    }

    function drawFallbackWorldMap() {
      landMask.fill(0);
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = WORLD_WIDTH; tempCanvas.height = WORLD_HEIGHT;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.fillStyle = "#000000";
      tCtx.beginPath();
      tCtx.ellipse(WORLD_WIDTH*0.25, WORLD_HEIGHT*0.4, WORLD_WIDTH*0.1, WORLD_HEIGHT*0.24, 0, 0, Math.PI*2);
      tCtx.ellipse(WORLD_WIDTH*0.32, WORLD_HEIGHT*0.7, WORLD_WIDTH*0.07, WORLD_HEIGHT*0.22, 0, 0, Math.PI*2);
      tCtx.ellipse(WORLD_WIDTH*0.55, WORLD_HEIGHT*0.36, WORLD_WIDTH*0.15, WORLD_HEIGHT*0.2, 0, 0, Math.PI*2);
      tCtx.ellipse(WORLD_WIDTH*0.53, WORLD_HEIGHT*0.6, WORLD_WIDTH*0.09, WORLD_HEIGHT*0.22, 0, 0, Math.PI*2);
      tCtx.ellipse(WORLD_WIDTH*0.82, WORLD_HEIGHT*0.74, WORLD_WIDTH*0.06, WORLD_HEIGHT*0.09, 0, 0, Math.PI*2);
      tCtx.fill();
      const imgData = tCtx.getImageData(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
      for (let i = 0; i < WORLD_WIDTH * WORLD_HEIGHT; i++) landMask[i] = imgData.data[i*4+3] > 100 ? 1 : 0;
      renderProcessedMapBuffer();
    }

    function updateCanvasDimensions() {
      const nw = viewport.clientWidth, nh = viewport.clientHeight;
      if (canvas.width !== nw || canvas.height !== nh) {
        canvas.width = nw; canvas.height = nh; renderCanvas();
      }
    }

    function renderCanvas() {
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      const renderW = Math.floor(WORLD_WIDTH * zoomLevel);
      const renderH = Math.floor(WORLD_HEIGHT * zoomLevel);
      ctx.drawImage(offscreenCanvas, Math.floor(viewX), Math.floor(viewY), renderW, renderH);

      const pixelSize = Math.max(1, Math.ceil(zoomLevel));
      modifiedPixels.forEach((color, key) => {
        const commaIdx = key.indexOf(',');
        const x = parseInt(key.substring(0, commaIdx), 10);
        const y = parseInt(key.substring(commaIdx + 1), 10);
        const screenX = Math.floor(viewX + x * zoomLevel);
        const screenY = Math.floor(viewY + y * zoomLevel);
        if (screenX + zoomLevel >= 0 && screenX <= canvas.width && screenY + zoomLevel >= 0 && screenY <= canvas.height) {
          ctx.fillStyle = color;
          ctx.fillRect(screenX, screenY, pixelSize, pixelSize);
        }
      });

      if (showGrid && zoomLevel >= 3) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        const startX = Math.max(0, Math.floor(-viewX / zoomLevel));
        const endX = Math.min(WORLD_WIDTH, Math.ceil((canvas.width - viewX) / zoomLevel));
        const startY = Math.max(0, Math.floor(-viewY / zoomLevel));
        const endY = Math.min(WORLD_HEIGHT, Math.ceil((canvas.height - viewY) / zoomLevel));
        for (let x = startX; x <= endX; x++) {
          const gx = Math.floor(viewX + x * zoomLevel) + 0.5;
          ctx.beginPath(); ctx.moveTo(gx, Math.max(0, viewY));
          ctx.lineTo(gx, Math.min(canvas.height, viewY + WORLD_HEIGHT * zoomLevel)); ctx.stroke();
        }
        for (let y = startY; y <= endY; y++) {
          const gy = Math.floor(viewY + y * zoomLevel) + 0.5;
          ctx.beginPath(); ctx.moveTo(Math.max(0, viewX), gy);
          ctx.lineTo(Math.min(canvas.width, viewX + WORLD_WIDTH * zoomLevel), gy); ctx.stroke();
        }
      }
      ctx.restore();
    }

    function getPixelCoordsAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const canvasX = clientX - rect.left, canvasY = clientY - rect.top;
      const px = Math.floor((canvasX - viewX) / zoomLevel);
      const py = Math.floor((canvasY - viewY) / zoomLevel);
      if (px >= 0 && px < WORLD_WIDTH && py >= 0 && py < WORLD_HEIGHT) return { x: px, y: py };
      return null;
    }

    function paintPixelAt(startX, startY) {
      const paintedList = [];
      const half = Math.floor(brushSize / 2);
      for (let dy = -half; dy < brushSize - half; dy++) {
        for (let dx = -half; dx < brushSize - half; dx++) {
          const px = startX + dx, py = startY + dy;
          if (px >= 0 && px < WORLD_WIDTH && py >= 0 && py < WORLD_HEIGHT) {
            const idx = py * WORLD_WIDTH + px;
            if (paintableMask[idx] === 0) continue;
            const key = `${px},${py}`;
            if (modifiedPixels.get(key) !== selectedColor) {
              modifiedPixels.set(key, selectedColor);
              paintedList.push({ x: px, y: py, color: selectedColor });
            }
          }
        }
      }
      if (paintedList.length > 0) {
        audio.playPaintSound();
        renderCanvas();
        paintedList.forEach(p => {
          const key = `${p.x},${p.y}`;
          savePixelToIndexedDB(key, p.color, username);
          savePixelToCloud(p.x, p.y, p.color, username);
        });
        broadcastPixels(paintedList);
      }
    }

    // === Merkezi yayın fonksiyonu (MQTT + BroadcastChannel + localStorage) ===
    function broadcastPixels(paintedList) {
      const payload = paintedList.map(p => ({ x: p.x, y: p.y, color: p.color, user: username }));
      // 1) MQTT
      if (mqttClient && mqttClient.isConnected()) {
        payload.forEach(p => {
          try {
            const msg = new Paho.MQTT.Message(JSON.stringify(p));
            msg.destinationName = MQTT_TOPIC_PIXEL;
            mqttClient.send(msg);
          } catch(e) {}
        });
      }
      // 2) BroadcastChannel (aynı tarayıcı, farklı sekmeler)
      if (localChannel) {
        try { localChannel.postMessage({ type: 'pixels', items: payload }); } catch(e) {}
      }
      // 3) localStorage event (farklı pencereler/tarayıcılar aynı cihazda)
      try {
        localStorage.setItem(LS_PIXEL_KEY, JSON.stringify({ items: payload, ts: Date.now() }));
      } catch(e) {}
    }

    function applyRemotePixels(items) {
      let changed = false;
      items.forEach(p => {
        if (typeof p.x !== 'number' || typeof p.y !== 'number' || !p.color) return;
        if (p.x < 0 || p.x >= WORLD_WIDTH || p.y < 0 || p.y >= WORLD_HEIGHT) return;
        const key = `${p.x},${p.y}`;
        if (modifiedPixels.get(key) !== p.color) {
          modifiedPixels.set(key, p.color);
          savePixelToIndexedDB(key, p.color, p.user || 'Anon');
          changed = true;
        }
      });
      if (changed) renderCanvas();
    }

    function setBrushSize(size) {
      brushSize = size;
      [1, 2, 3].forEach(s => {
        const btn = document.getElementById(`brushBtn${s}`);
        if (btn) {
          btn.className = s === size
            ? "w-7 h-7 rounded-lg bg-blue-600 text-white text-xs font-bold border border-blue-400"
            : "w-7 h-7 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:bg-slate-700";
        }
      });
    }

    function applyZoom(factor, cx, cy) {
      const oldZoom = zoomLevel;
      zoomLevel = Math.max(0.3, Math.min(48, zoomLevel * factor));
      if (cx === undefined || cy === undefined) { cx = viewport.clientWidth / 2; cy = viewport.clientHeight / 2; }
      viewX = cx - (cx - viewX) * (zoomLevel / oldZoom);
      viewY = cy - (cy - viewY) * (zoomLevel / oldZoom);
      renderCanvas();
    }
    function zoomInButton() { applyZoom(1.35); }
    function zoomOutButton() { applyZoom(1 / 1.35); }

    function resetView() {
      zoomLevel = Math.min(viewport.clientWidth / WORLD_WIDTH, viewport.clientHeight / WORLD_HEIGHT) * 0.95;
      if (zoomLevel < 0.2) zoomLevel = 0.8;
      viewX = (viewport.clientWidth - WORLD_WIDTH * zoomLevel) / 2;
      viewY = (viewport.clientHeight - WORLD_HEIGHT * zoomLevel) / 2;
      renderCanvas();
    }

    function setupInteractions() {
      viewport.addEventListener('mousedown', (e) => {
        isMouseDown = true; isDragging = false;
        dragStartX = e.clientX; dragStartY = e.clientY;
        dragStartViewX = viewX; dragStartViewY = viewY;
      });
      window.addEventListener('mousemove', (e) => {
        const coords = getPixelCoordsAt(e.clientX, e.clientY);
        if (coords) document.getElementById('coordDisplay').innerText = `X: ${coords.x}, Y: ${coords.y}`;
        if (!isMouseDown) return;
        const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 4) {
          isDragging = true;
          viewport.style.cursor = "grabbing";
          viewX = dragStartViewX + dx; viewY = dragStartViewY + dy;
          renderCanvas();
        }
      });
      window.addEventListener('mouseup', (e) => {
        if (isMouseDown && !isDragging && e.button === 0) {
          const coords = getPixelCoordsAt(e.clientX, e.clientY);
          if (coords) paintPixelAt(coords.x, coords.y);
        }
        isMouseDown = false; isDragging = false;
        viewport.style.cursor = "crosshair";
      });
      viewport.addEventListener('contextmenu', (e) => e.preventDefault());
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const factor = e.deltaY < 0 ? 1.2 : 0.833;
        applyZoom(factor, e.clientX - rect.left, e.clientY - rect.top);
      }, { passive: false });
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isMouseDown = true; isDragging = false;
          dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
          dragStartViewX = viewX; dragStartViewY = viewY;
        } else if (e.touches.length === 2) {
          isMouseDown = false;
          touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
      }, { passive: false });
      viewport.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isMouseDown) {
          const touch = e.touches[0];
          const dx = touch.clientX - dragStartX, dy = touch.clientY - dragStartY;
          if (Math.hypot(dx, dy) > 4) { isDragging = true; viewX = dragStartViewX + dx; viewY = dragStartViewY + dy; renderCanvas(); }
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          if (touchStartDist > 0) {
            const factor = dist / touchStartDist;
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            const rect = canvas.getBoundingClientRect();
            applyZoom(factor, midX - rect.left, midY - rect.top);
            touchStartDist = dist;
          }
        }
      }, { passive: false });
      viewport.addEventListener('touchend', (e) => {
        if (isMouseDown && !isDragging) {
          const touch = e.changedTouches[0];
          if (touch) {
            const coords = getPixelCoordsAt(touch.clientX, touch.clientY);
            if (coords) paintPixelAt(coords.x, coords.y);
          }
        }
        isMouseDown = false; isDragging = false;
      });
      window.addEventListener('resize', () => updateCanvasDimensions());
    }

    let mqttClient = null;
    let localChannel = null;
    let cloudDb = null;
    let cloudAuth = null;
    let cloudUser = null;
    let localDb = null;
    let currentBrokerIndex = 0;

    function initIndexedDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open('MSZPixelDB', 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('pixels')) db.createObjectStore('pixels', { keyPath: 'key' });
          if (!db.objectStoreNames.contains('chat')) db.createObjectStore('chat', { keyPath: 'id', autoIncrement: true });
        };
        request.onsuccess = (e) => { localDb = e.target.result; resolve(localDb); };
        request.onerror = () => resolve(null);
      });
    }

    async function loadPixelsFromIndexedDB() {
      if (!localDb) return;
      return new Promise((resolve) => {
        try {
          const tx = localDb.transaction('pixels', 'readonly');
          const req = tx.objectStore('pixels').getAll();
          req.onsuccess = () => {
            if (req.result && req.result.length > 0) {
              req.result.forEach(item => modifiedPixels.set(item.key, item.color));
              renderCanvas();
            }
            resolve();
          };
          req.onerror = () => resolve();
        } catch (e) { resolve(); }
      });
    }

    function savePixelToIndexedDB(key, color, user) {
      if (!localDb) return;
      try {
        const tx = localDb.transaction('pixels', 'readwrite');
        tx.objectStore('pixels').put({ key, color, user: user || 'Anon', time: Date.now() });
      } catch(e) {}
    }

    async function loadChatFromIndexedDB() {
      if (!localDb) return;
      return new Promise((resolve) => {
        try {
          const tx = localDb.transaction('chat', 'readonly');
          const req = tx.objectStore('chat').getAll();
          req.onsuccess = () => {
            if (req.result && req.result.length > 0) {
              req.result.slice(-50).forEach(item => {
                appendChatMessage(item.user, item.text, item.user === username, false, true);
              });
            }
            resolve();
          };
          req.onerror = () => resolve();
        } catch (e) { resolve(); }
      });
    }

    function saveChatToIndexedDB(user, text) {
      if (!localDb) return;
      try {
        const tx = localDb.transaction('chat', 'readwrite');
        tx.objectStore('chat').add({ user, text, time: Date.now() });
      } catch(e) {}
    }

    async function initCloudStorage() {
      await initIndexedDB();
      await loadPixelsFromIndexedDB();
      await loadChatFromIndexedDB();

      if (typeof window.FirebaseModules === 'undefined') {
        setTimeout(initCloudStorage, 300);
        return;
      }
      const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot, doc, setDoc, getDocs } = window.FirebaseModules;
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'msz-pixel';
      let firebaseConfig = null;
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
      }
      if (!firebaseConfig) {
        console.warn("MSZ Pixel: Cloud config yok, yerel + MQTT modu.");
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        cloudAuth = getAuth(app);
        cloudDb = getFirestore(app);
        let userCred;
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          userCred = await signInWithCustomToken(cloudAuth, __initial_auth_token);
        } else {
          userCred = await signInAnonymously(cloudAuth);
        }
        cloudUser = userCred.user;
        if (!cloudUser) return;

        const pixelsCollection = collection(cloudDb, 'artifacts', appId, 'public', 'data', 'pixels');
        try {
          const querySnapshot = await getDocs(pixelsCollection);
          let loadedCount = 0;
          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data && typeof data.x === 'number' && typeof data.y === 'number' && data.color) {
              const key = `${data.x},${data.y}`;
              modifiedPixels.set(key, data.color);
              savePixelToIndexedDB(key, data.color, data.user || 'Anon');
              loadedCount++;
            }
          });
          if (loadedCount > 0) renderCanvas();
        } catch (e) { console.warn("Cloud fetch error:", e); }

        onSnapshot(pixelsCollection, (snapshot) => {
          const items = [];
          snapshot.docChanges().forEach((change) => {
            if (change.type === 'added' || change.type === 'modified') {
              const data = change.doc.data();
              if (data && typeof data.x === 'number' && typeof data.y === 'number' && data.color) {
                items.push({ x: data.x, y: data.y, color: data.color, user: data.user });
              }
            }
          });
          if (items.length > 0) applyRemotePixels(items);
        }, (error) => console.error("Cloud pixel sync error:", error));

        const chatCollection = collection(cloudDb, 'artifacts', appId, 'public', 'data', 'chat');
        onSnapshot(chatCollection, (snapshot) => {
          snapshot.docChanges().forEach((change) => {
            if (change.type === 'added') {
              const data = change.doc.data();
              if (data && data.user && data.text) {
                saveChatToIndexedDB(data.user, data.text);
                if (data.user !== username) {
                  appendChatMessage(data.user, data.text, false, true, true);
                }
              }
            }
          });
        }, (error) => console.error("Cloud chat sync error:", error));

      } catch (err) { console.error("MSZ Pixel: Cloud init failed:", err); }
    }

    function savePixelToCloud(x, y, color, user) {
      if (!cloudDb || !cloudUser) return;
      const { doc, setDoc } = window.FirebaseModules;
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'msz-pixel';
      const docRef = doc(cloudDb, 'artifacts', appId, 'public', 'data', 'pixels', `${x}_${y}`);
      setDoc(docRef, { x, y, color, user, updatedAt: Date.now() }).catch(() => {});
    }

    function saveChatToCloud(user, text) {
      if (!cloudDb || !cloudUser) return;
      const { collection, addDoc } = window.FirebaseModules;
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'msz-pixel';
      const chatColl = collection(cloudDb, 'artifacts', appId, 'public', 'data', 'chat');
      addDoc(chatColl, { user, text, createdAt: Date.now() }).catch(() => {});
    }

    // === MSZ Pixel: Çoklu Broker + BroadcastChannel + localStorage ===
    function initMQTT() {
      // BroadcastChannel
      if ('BroadcastChannel' in window && !localChannel) {
        try {
          localChannel = new BroadcastChannel('msz_pixel_sync');
          localChannel.onmessage = (event) => {
            const data = event.data;
            if (data.type === 'pixels') {
              applyRemotePixels(data.items);
            } else if (data.type === 'chat') {
              if (data.user !== username) {
                appendChatMessage(data.user, data.text, false, true, false);
              }
            } else if (data.type === 'hello') {
              // yeni katılan kullanıcıya mevcut durumu bildir (opsiyonel)
            }
          };
        } catch(e) { console.warn("BroadcastChannel hatası:", e); }
      }

      // localStorage event fallback
      window.addEventListener('storage', (e) => {
        if (e.key === LS_PIXEL_KEY && e.newValue) {
          try {
            const data = JSON.parse(e.newValue);
            if (data && Array.isArray(data.items)) applyRemotePixels(data.items);
          } catch(err) {}
        } else if (e.key === LS_CHAT_KEY && e.newValue) {
          try {
            const data = JSON.parse(e.newValue);
            if (data && data.user && data.text && data.user !== username) {
              appendChatMessage(data.user, data.text, false, true, false);
            }
          } catch(err) {}
        }
      });

      connectToBroker(0);
    }

    function connectToBroker(index) {
      if (index >= MQTT_BROKERS.length) {
        document.getElementById('mqttStatus').innerText = "Yerel Mod (P2P)";
        document.getElementById('statusIndicator').className = "inline-block w-2 h-2 rounded-full bg-emerald-500";
        return;
      }
      const broker = MQTT_BROKERS[index];
      const statusEl = document.getElementById('mqttStatus');
      const indEl = document.getElementById('statusIndicator');
      statusEl.innerText = `${broker.host} bağlanıyor...`;

      try {
        const clientId = "msz_pixel_" + Math.random().toString(16).substr(2, 8);
        // Paho: host, port, path (veya clientId). WSS için host, port, path
        mqttClient = new Paho.MQTT.Client(broker.host, broker.port, broker.path, clientId);

        mqttClient.onConnectionLost = (resp) => {
          statusEl.innerText = "Bağlantı koptu, yeniden deneniyor...";
          indEl.className = "inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping";
          setTimeout(() => connectToBroker(index), 3000);
        };

        mqttClient.onMessageArrived = (message) => {
          try {
            const data = JSON.parse(message.payloadString);
            if (message.destinationName === MQTT_TOPIC_PIXEL) {
              applyRemotePixels([data]);
            } else if (message.destinationName === MQTT_TOPIC_CHAT) {
              if (data.user !== username) {
                appendChatMessage(data.user, data.text, false, true, false);
              }
            }
          } catch(e) {}
        };

        mqttClient.connect({
          useSSL: broker.ssl,
          timeout: 8,
          keepAliveInterval: 30,
          cleanSession: true,
          onSuccess: () => {
            statusEl.innerText = `Canlı: ${broker.host}`;
            indEl.className = "inline-block w-2 h-2 rounded-full bg-emerald-500";
            mqttClient.subscribe(MQTT_TOPIC_PIXEL);
            mqttClient.subscribe(MQTT_TOPIC_CHAT);
          },
          onFailure: (err) => {
            console.warn(`MSZ Pixel: ${broker.host} başarısız:`, err);
            statusEl.innerText = "Sonraki broker deneniyor...";
            indEl.className = "inline-block w-2 h-2 rounded-full bg-amber-500";
            setTimeout(() => connectToBroker(index + 1), 1500);
          }
        });
      } catch (err) {
        console.warn("MQTT init hatası:", err);
        setTimeout(() => connectToBroker(index + 1), 1000);
      }
    }

    function toggleGrid() {
      showGrid = !showGrid;
      const btn = document.getElementById('gridBtn');
      btn.className = showGrid
        ? "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium border border-blue-500 flex items-center gap-1.5 transition-colors"
        : "px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition-colors";
      renderCanvas();
    }

    function toggleAudio() {
      audio.enabled = !audio.enabled;
      document.getElementById('audioBtn').innerHTML = audio.enabled
        ? `<i class="fa-solid fa-volume-high"></i>`
        : `<i class="fa-solid fa-volume-xmark text-slate-500"></i>`;
    }

    function toggleChat() {
      document.getElementById('chatSidebar').classList.toggle('translate-x-full');
    }

    function buildPaletteGUI() {
      const container = document.getElementById('paletteContainer');
      container.innerHTML = "";
      PALETTE.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = "button"; btn.title = item.name;
        const isSelected = selectedColor.toLowerCase() === item.hex.toLowerCase();
        btn.className = `w-7 h-7 rounded-lg shrink-0 flex items-center justify-center border transition-all ${
          isSelected ? "border-2 border-white ring-2 ring-blue-500/50" : "border-slate-700/80 hover:border-slate-400"
        }`;
        btn.style.backgroundColor = item.hex;
        if (isSelected) btn.innerHTML = `<i class="fa-solid fa-check text-[10px] ${item.hex === '#ffffff' ? 'text-black' : 'text-white'}"></i>`;
        btn.onclick = () => { selectedColor = item.hex; buildPaletteGUI(); };
        container.appendChild(btn);
      });
    }

    function selectCustomColor(hex) { selectedColor = hex; buildPaletteGUI(); }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      // Sadece bir kez local ekle
      appendChatMessage(username, text, true, false, false);
      saveChatToIndexedDB(username, text);
      saveChatToCloud(username, text);

      const payload = { user: username, text };

      // MQTT
      if (mqttClient && mqttClient.isConnected()) {
        try {
          const msg = new Paho.MQTT.Message(JSON.stringify(payload));
          msg.destinationName = MQTT_TOPIC_CHAT;
          mqttClient.send(msg);
        } catch(e) {}
      }
      // BroadcastChannel
      if (localChannel) {
        try { localChannel.postMessage({ type: 'chat', ...payload }); } catch(e) {}
      }
      // localStorage
      try { localStorage.setItem(LS_CHAT_KEY, JSON.stringify({ ...payload, ts: Date.now() })); } catch(e) {}

      input.value = "";
    }

    // appendChatMessage: playSound = uzak mesajlarda ses çal, dedupeKey ile aynı mesajı iki kez ekleme
    function appendChatMessage(user, text, isSelf, playSound = true, fromRemote = false) {
      const chatMessages = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `p-2 rounded-lg text-xs break-words ${
        isSelf ? "bg-blue-600/20 border border-blue-500/30 text-blue-100 ml-4" : "bg-slate-800 border border-slate-700 text-slate-200 mr-4"
      }`;
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `
        <div class="flex items-center justify-between font-bold text-[11px] ${isSelf ? "text-blue-400" : "text-slate-400"} mb-0.5">
          <span>${escapeHtml(user)}</span>
          <span class="text-[9px] font-normal text-slate-500">${timeStr}</span>
        </div>
        <div>${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (!isSelf && playSound) audio.playChatSound();
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = function() {
      loadWorldMap();
      buildPaletteGUI();
      setupInteractions();
      updateCanvasDimensions();
      resetView();
      initMQTT();
      initCloudStorage();
    };
  </script>
